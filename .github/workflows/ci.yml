name: CI

# 13/11/2026 — UNA CORSA SOLA PER OGNI AGGIORNAMENTO DI UNA RICHIESTA.
#
# Prima la CI partiva anche a ogni invio su un ramo claude/**: sui rami con una
# richiesta aperta lo stesso commit veniva provato due volte, una per il ramo e
# una per la richiesta. Divise in fette, le due corse chiedevano insieme 34
# macchine, e l'account ne da' circa 20: meta' dei lavori aspettava in coda e
# la CI superava i 4 minuti (corse 43365332694 e 43365403658). Nicola ha
# deciso il 13/11 di tenere solo la corsa della richiesta: prova il codice gia'
# unito a main, a ogni aggiornamento. Su main non cambia niente: ogni unione fa
# girare la CI, e il rilascio parte dal suo esito. Un ramo senza richiesta
# aperta non ha controlli finche' la richiesta non si apre.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


# 27/8/2026 (R188) — Sui rami di lavoro l'ultimo invio e' l'unico che interessa:
# i controlli sui commit gia' superati bruciano minuti e basta. Su `main` vale
# il contrario e la condizione lo dice: quelle esecuzioni NON si annullano mai,
# perche' il rilascio in produzione parte proprio dal loro esito — annullarne
# una vorrebbe dire fermare un rilascio a caso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


# #244 — Il minimo indispensabile. Senza questo blocco ogni lavoro parte col
# permesso predefinito del repository, che di norma è di SCRITTURA: uno script
# di una dipendenza compromessa potrebbe scrivere sul codice o creare rilasci.
# Qui serve solo leggere.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #139 — PERCHE' 22 E NON 20 (21/8/2026).
      #
      # Le prove sui permessi visti da fuori, appena hanno cominciato a girare
      # davvero, si sono fermate qui:
      #
      #   Error: Node.js 20 detected without native WebSocket support.
      #
      # Il client Supabase costruisce il pezzo «tempo reale» gia' nel
      # costruttore, e quello vuole un WebSocket che Node 20 non ha. Non era un
      # difetto nuovo: sarebbe uscito identico con un progetto di prova a
      # pagamento. Si vedeva solo adesso perche' prima quelle prove si
      # saltavano.
      #
      # Riprodotto a mano prima di cambiare: su Node 20 il client non si
      # costruisce, su Node 22 si'.
      #
      # POI L'HO CHIUSA DEL TUTTO. Nel primo giro avevo messo 22 e scritto che
      # la distanza con la produzione — che gira su Node 24 — restava aperta
      # perche' non avevo un Node 24 con cui provare. Non era vero: bastava
      # scaricarlo. Provato, e passa tutto:
      #
      #   943 prove unitarie verdi · typecheck pulito · lint senza errori ·
      #   build di produzione riuscita, 173 pagine statiche generate
      #
      # Adesso la CI prova sulla stessa versione che serve i clienti. Il
      # `engines` del progetto dice >=20, quindi 24 e' dentro le regole.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 13/11/2026 — LA CACHE DI COMPILAZIONE DI NEXT.
      #
      # Tre lavori costruiscono il sito (questo, le prove nel browser e axe), e
      # ognuno ricompilava tutto da zero: circa 2 minuti a testa, il pezzo piu'
      # lungo dopo le prove. Next tiene in .next/cache quello che ha gia'
      # compilato e consiglia di conservarlo fra un giro e l'altro della CI: si
      # ricompila solo cio' che e' cambiato. Cosa si costruisce non cambia.
      #
      # La chiave: su main una per commit, cosi' l'ultima e' sempre la piu'
      # fresca; su un ramo o una richiesta una per ramo, cosi' si salva al primo
      # giro (la prima fetta che finisce; le altre trovano il posto preso e
      # passano oltre) e i giri dopo non perdono tempo a ricaricarla. Chi non trova
      # la sua riparte dalla piu' recente disponibile (`restore-keys`): per una
      # richiesta nuova, quella dell'ultimo commit di main.
      #
      # Ogni tipo di costruzione ha la sua cache (lint, browser, axe): le tre
      # costruiscono con variabili pubbliche diverse, e una cache fatta con le
      # variabili di un altro lavoro fa ricompilare molti pezzi. Misurato il
      # 13/11: con la cache comune le fette del browser costruivano in 73-113
      # secondi, questo lavoro con la sua in 66.
      #
      # SOLO LA COMPILAZIONE, MAI I DATI DEL SITO ACCESO. In .next/cache Next
      # scrive anche quello che il sito salva mentre gira (fetch-cache: per
      # esempio la home gia' calcolata; images: le foto ridimensionate). Se
      # passassero da un giro all'altro, una home rotta da una richiesta
      # potrebbe uscire con la copia del giro prima e le prove resterebbero
      # verdi: il collaudo l'ha riprodotto il 13/11. Per questo si tengono
      # solo webpack, swc e il registro del controllo dei tipi (.tsbuildinfo),
      # e la chiave e' passata a v2 per non riprendere le cache di prima.
      - name: Riprendi la cache di compilazione di Next
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .next/cache/webpack
            .next/cache/swc
            .next/cache/.tsbuildinfo
          key: next-build-v2-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.ref == 'refs/heads/main' && github.sha || github.head_ref || github.ref_name }}
          restore-keys: |
            next-build-v2-lint-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # Storybook 8.x dichiara peer deps su React 18 + ecc, ma il monorepo usa
      # react-dom 18.3 risolto via Next 14; senza --legacy-peer-deps fallisce.
      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      # Build verifica typecheck + bundling.
      # Le env var pubbliche di Supabase devono essere presenti in build perché
      # Next inline-a process.env.NEXT_PUBLIC_* nei chunk client.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          # i NEXT_PUBLIC_* sopra sono placeholder solo per superare il build;
          # in produzione vengono dal hosting (Vercel → Settings → Environment
          # Variables). Mai mettere chiavi reali qui.
        run: npm run build

  # 13/11/2026 — LE PROVE UNITARIE GIRANO IN SEI FETTE, NELLO STESSO MOMENTO.
  #
  # In un lavoro solo il passo «Test» durava 6 minuti (corsa 43359816356 su
  # main): era lui a tenere la CI di ogni richiesta fra 5 minuti e mezzo e 7 e
  # mezzo. Adesso gli stessi ~1.400 file si dividono in sei macchine con lo
  # sharding di vitest: ognuna fa girare un sesto dei file, con la stessa
  # configurazione, lo stesso PostgreSQL e lo stesso obbligo di non saltarlo.
  #
  # Quale fetta e quante sono le dice GitHub (`strategy.job-index` e
  # `strategy.job-total`): per avere piu' fette si allunga l'elenco `fetta` e
  # basta, non c'e' un secondo numero da tenere d'accordo a mano.
  #
  # Dividere apre un buco che il lavoro unico non aveva: una fetta che prende la
  # parte sbagliata lascia dei file senza esito, e ogni fetta da sola esce
  # verde. Per questo ognuna consegna il suo referto e il lavoro
  # «unit-tests-insieme» li rimette insieme: si ferma rosso se un file
  # dell'elenco non ha girato, o ha girato due volte.
  unit-tests:
    name: Unit tests (fetta ${{ matrix.fetta }})
    runs-on: ubuntu-latest
    # R01-011 — 15 e non 10: adesso girano anche le prove che accendono un PostgreSQL usa e getta.
    timeout-minutes: 15
    strategy:
      # Una fetta rossa non ferma le altre: si vede subito tutto quello che e' rotto.
      fail-fast: false
      matrix:
        fetta: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # R01-011 (12/11/2026) — SETTE FILE DI PROVA SI SALTAVANO IN SILENZIO.
      #
      # Le prove che girano su un database vero (tests/unit/postgres-usa-e-getta.ts
      # e un-invito-scritto-a-mano-non-paga.test.ts) si saltano se sulla macchina
      # non c'e' PostgreSQL: giusto sul computer di chi sviluppa, sbagliato qui,
      # dove la verifica usciva verde senza averle mai eseguite. Qui PostgreSQL
      # si installa e si accende, e il passo dopo si ferma ROSSO se non risponde.
      - name: Installa e accendi PostgreSQL per le prove col database vero
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql
          sudo service postgresql start
          sudo -u postgres createuser --superuser "$(whoami)" || true
          echo "PGHOST=/var/run/postgresql" >> "$GITHUB_ENV"
          echo "PGUSER=$(whoami)" >> "$GITHUB_ENV"

      - name: Le prove col database vero non si possono saltare
        run: |
          set -uo pipefail
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            echo "::error::initdb non c'e': le prove che accendono un PostgreSQL usa e getta si salterebbero in silenzio."
            exit 1
          fi
          if ! psql -X -d postgres -Atc 'select 1' >/dev/null; then
            echo "::error::PostgreSQL non risponde su $PGHOST: le prove col database vero si salterebbero in silenzio."
            exit 1
          fi
          echo "PostgreSQL c'e' e risponde: le prove col database vero girano."

      # Unit test + guardia integrita' file migration + le prove col database vero.
      # Questa fetta fa girare la sua parte dei file; prima scrive l'elenco di
      # TUTTI i file (vitest list), cosi' chi rimette insieme le fette sa
      # cosa doveva girare.
      - name: Test
        env:
          # Per i file di prova che lo leggono: qui saltare per mancanza di PostgreSQL e' un errore.
          PROVE_POSTGRES_OBBLIGATORIE: "1"
          FETTA_INDICE: ${{ strategy.job-index }}
          FETTE_TOTALI: ${{ strategy.job-total }}
          COMMIT: ${{ github.sha }}
          REFERTO: ${{ runner.temp }}/referto-unitari
        run: |
          set -euo pipefail
          mkdir -p "$REFERTO"
          printf '{"indice":%s,"totale":%s,"commit":"%s","radice":"%s"}\n' \
            "$FETTA_INDICE" "$FETTE_TOTALI" "$COMMIT" "$PWD" > "$REFERTO/fetta.json"
          npx vitest list --filesOnly --json="$REFERTO/universo.json" > /dev/null
          npm run test -- --shard="$((FETTA_INDICE + 1))/$FETTE_TOTALI" \
            --reporter=default --reporter=github-actions --reporter=json \
            --outputFile.json="$REFERTO/esito.json"

      - name: Consegna il referto della fetta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: referto-unitari-${{ strategy.job-index }}
          path: ${{ runner.temp }}/referto-unitari
          if-no-files-found: error
          retention-days: 3

  integration-tests:
    name: Integration tests (DB)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # 🔴-4: i test RLS/grant non devono auto-skipparsi in SILENZIO (CI verde con
      # RLS rotta). Se ci sono i secret di un progetto Supabase DI TEST → girano e
      # fanno enforcement. Se mancano → warning VISIBILE + skip: niente false-green
      # silenzioso, ma non blocchiamo i merge di chi non ha ancora un DB di test.
      - name: Check RLS secrets
        id: rls
        # Segreti con nomi DEDICATI alla prova (suffisso _TEST). Prima si usavano
        # gli stessi nomi della produzione, chiave di servizio compresa: un
        # errore di configurazione e i test scrivevano sul database dei clienti.
        # Il commento diceva «progetto di TEST», ma niente lo verificava.
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
          ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SR: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$ANON" ] || [ -z "$SR" ]; then
            echo "::warning::Test d'integrazione su Supabase SALTATI: mancano SUPABASE_TEST_URL, SUPABASE_TEST_ANON_KEY, SUPABASE_TEST_SERVICE_ROLE_KEY. I controlli di permessi girano comunque nel job 'Controlli database (Postgres locale)', che non usa chiavi."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Test d'integrazione di sicurezza (RLS + grant EXECUTE su SECURITY DEFINER)
      # contro il DB di test. Girano SOLO se i secret ci sono (vedi step sopra).
      - name: Integration tests
        if: steps.rls.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:integration

      # #139 — SENZA I SEGRETI LE PROVE NON SI SALTANO PIU': LA CI SI AVVIA UN
      # SUPABASE SUO.
      #
      # Prima qui c'era solo un bivio: coi segreti di un progetto di prova le
      # prove giravano, senza si saltavano con un avviso. Sono sempre mancati,
      # quindi non hanno mai girato — e il verde della CI copriva dei permessi
      # che nessuno aveva guardato da fuori.
      #
      # Adesso la CI se lo avvia da sola dentro il runner: vive quanto il giro e
      # poi sparisce. Non costa niente (un progetto di prova costa 10 dollari al
      # mese), non ha nessuna chiave da custodire su GitHub, e nasce vuoto ogni
      # volta, quindi due giri non possono sporcarsi a vicenda.
      #
      # I segreti restano ammessi e hanno la precedenza: se un giorno esistono,
      # gira il passo qui sopra e questo non parte.
      - name: Avvia un Supabase locale
        if: steps.rls.outputs.enabled != 'true'
        run: bash tests/supabase-locale/avvia.sh

      - name: I permessi visti da fuori, contro il Supabase locale
        id: locale
        if: steps.rls.outputs.enabled != 'true'
        run: npm run test:integration

      # #229 — UN SEGNO VERDE CHE NON VUOL DIRE «TUTTO PROVATO».
      #
      # Due gruppi di prove si auto-saltano quando mancano i segreti, e finora
      # lo dicevano solo con un avviso dentro il log — dove non guarda nessuno.
      # Fuori restava una spunta verde identica a quella di una CI che ha
      # provato tutto. Adesso, quando qualcosa non ha girato, sta scritto in
      # cima al riepilogo della CI, che è la prima cosa che si vede.
      - name: Dichiara cosa NON ha girato
        if: always()
        run: |
          {
            if [ "${{ steps.rls.outputs.enabled }}" = "true" ]; then
              echo "✅ **Prove d'integrazione sui permessi**: girate, contro il progetto di prova dei segreti."
            elif [ "${{ steps.locale.outcome }}" = "success" ]; then
              echo "✅ **Prove d'integrazione sui permessi**: girate, contro un Supabase avviato qui dentro."
            else
              echo "⚠️ **Prove d'integrazione sui permessi: NON girate.**"
              echo ""
              echo "Nessun segreto di un progetto di prova, e il Supabase locale non e' partito."
              echo "Il verde qui sopra non dice che i permessi sul database sono a posto: dice che non sono stati provati."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rls-locale:
    name: Controlli database (Postgres locale, senza chiavi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Perche' questo job esiste: i test di sicurezza sul database si
    # auto-skippavano quando mancavano i segreti di un progetto di prova. Un
    # verde che non provava niente — e proprio sui controlli che tengono chiusi
    # i dati dei clienti. Qui si ricostruisce lo schema VERO dalle migrazioni su
    # un Postgres del runner: nessuna chiave, nessuna rete, e non si salta mai.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa il client psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Ricostruisce il database da zero: impalcatura Supabase + tutte le
      # migrazioni nell'ordine vero. Fallisce se una migrazione non si applica —
      # e cinque non si applicavano, fermandosi a meta' file.
      - name: Ricostruisci lo schema dalle migrazioni
        run: bash tests/sql/harness/apply.sh mycity_ci

      # I controlli di comportamento: si apre una sessione col ruolo di un
      # estraneo e si prova a fare il danno.
      - name: Controlli di permessi e privacy
        run: bash tests/sql/harness/run.sh mycity_ci

      # La ricostruzione qui sopra parte da tabelle VUOTE: una migrazione che
      # riscrive righe esistenti li' non riscrive niente, e passa comunque. La
      # 124 e' passata cosi' e si e' fermata sul primo database con dentro un
      # ordine vero. Qui l'ultima migrazione si applica su un database che ha
      # gia' dei dati, che e' il giro che fa la produzione.
      - name: L'ultima migrazione regge un database con dentro degli ordini
        run: bash tests/sql/harness/migrazione-su-database-pieno.sh mycity_pieno_ci

      # 28/8/2026 — L'IDEMPOTENZA DEL RILASCIO SI PROVA, NON SI DICHIARA.
      #
      # Il passo del rilascio applicava TUTTI i file a ogni pubblicazione, con
      # un commento che diceva «le migrazioni del progetto sono idempotenti».
      # Non lo sono: la 001 e la 002 creano tabelle senza `IF NOT EXISTS`, e su
      # un database che le ha gia' — la produzione — psql muore sul primo file.
      # Nessuno se ne era accorto perche' quel lavoro non gira (mancano i
      # segreti): sarebbe esploso il giorno in cui li si configura, cioe'
      # proprio mentre si spegne il rilascio automatico.
      #
      # Qui lo script del rilascio gira DUE VOLTE sullo stesso database: la
      # seconda deve applicare zero file e uscire verde.
      - name: Il rilascio riapplicato due volte non si rompe
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/mycity_ci
        run: |
          bash scripts/applica-migrazioni-mancanti.sh | tee /tmp/giro1.txt
          bash scripts/applica-migrazioni-mancanti.sh | tee /tmp/giro2.txt
          grep -q "applicate 0 " /tmp/giro2.txt \
            || { echo "::error::il secondo giro ha riapplicato delle migrazioni: il rilascio non e' ripetibile"; exit 1; }

      # 7/9/2026 — LA PRODUZIONE NON E' UN DATABASE RICOSTRUITO DA ZERO.
      #
      # Il passo qui sopra prova l'idempotenza su un database che la CI ha
      # appena costruito applicando i file in ordine e registrandoli tutti: li'
      # ogni migrazione risulta gia' nota, quindi si salta. La produzione e'
      # nata PRIMA del registro, e le sue righe hanno un'altra forma: la regola
      # di salto non riconosce i file, lo script prova a rieseguire la 001 e
      # muore sul primo comando. Cioe' il difetto vive esattamente nella forma
      # di database che questo lavoro non costruisce mai.
      #
      # Il controllo sotto quella forma la ricostruisce apposta e pretende un
      # rifiuto pulito. Era stato scritto il 7/9 (PR #252) e lasciato fuori
      # dalla CI: un controllo che nessuno lancia non e' una rete, e in un mese
      # nessuno si accorge se smette di funzionare.
      - name: Lo script del rilascio non si schianta sul database di produzione
        run: bash tests/sql/harness/lo-script-non-si-schianta-sul-database-nato-prima-del-registro.sh mycity_nato_prima_ci

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # #233 — Attenzione a cosa prova questo passo: gira contro il database
      # che la CI ha appena ricostruito applicando TUTTE le migrazioni del
      # repo. Quindi non puo' diventare rosso per definizione: confronta il
      # repo con una copia del repo. E' un controllo di coerenza interna, non
      # la sentinella delle migrazioni dimenticate in produzione — quella e' un
      # lavoro a parte (.github/workflows/deriva-migrazioni-produzione.yml),
      # perche' richiede il segreto del database vero.
      - name: Coerenza interna delle migrazioni (NON e' il controllo su produzione)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/mycity_ci
        run: npm run db:check-drift

      # #4 — I tipi del database sono generati dalle migrazioni, ma nessuno
      # controllava che fossero aggiornati. Peggio: il generatore perdeva
      # silenziosamente le colonne dichiarate in fila nella stessa istruzione
      # `alter table` — fra cui `seller_payout_cents`, che cinque file di
      # codice nominano. Il file si generava lo stesso e nessuno se ne
      # accorgeva. Adesso: si rigenera, e se il risultato e' diverso da quello
      # committato il passo diventa rosso.
      - name: I tipi del database sono aggiornati
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts \
            || { echo "::error::lib/database.types.ts non e' aggiornato: esegui 'npm run db:types' e committa il risultato."; exit 1; }

  e2e-tests:
    name: E2E smoke (Playwright)
    # 13/11/2026 — Ubuntu 24.04 fisso: su 26.04 Playwright non installa Chromium
    # («Playwright does not support chromium on ubuntu26.04-x64»).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # 🔴-4: gli smoke e2e richiedono un backend reale (la home/cart/auth
      # renderizzano dati dal DB). Se ci sono i secret di un Supabase di TEST →
      # build + avvio app + Playwright. Se mancano → warning VISIBILE + skip,
      # così il job non blocca i merge ma resta pronto ad attivarsi.
      # #240 — I segreti si chiamavano come quelli di produzione
      # (NEXT_PUBLIC_SUPABASE_URL/ANON_KEY): chi li configurava incollava le
      # chiavi vere, e gli smoke andavano a scrivere sul database dei clienti.
      # Ora i nomi dicono cosa sono, e c'e' un controllo che rifiuta di partire
      # se l'indirizzo coincide con quello di produzione.
      - name: Check E2E secrets
        id: e2e
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
          ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          URL_PRODUZIONE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$URL" ] || [ -z "$ANON" ]; then
            echo "::warning::E2E smoke SALTATI: servono SUPABASE_TEST_URL e SUPABASE_TEST_ANON_KEY (un progetto Supabase di PROVA, mai quello vero)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          host_prova="$(printf '%s' "$URL" | sed -E 's#^https?://##' | cut -d/ -f1)"
          # 14/10/2026 — Il confronto cercava il nome della macchina
          # (<progetto>.supabase.co) dentro SUPABASE_DB_URL. Funzionava solo con
          # la connessione diretta, db.<progetto>.supabase.co. Il backup chiede di
          # passare al Session pooler, dove il progetto sta nell'utente
          # (postgres.<progetto>@aws-…pooler.supabase.com) e quel nome non c'e'
          # piu': il controllo si sarebbe spento senza dirlo. Ora si cerca anche
          # il codice del progetto, che c'e' in tutte e due le forme.
          progetto_prova=""
          case "$host_prova" in
            *.supabase.co) progetto_prova="${host_prova%.supabase.co}" ;;
          esac
          stessa_produzione=no
          if [ -n "$URL_PRODUZIONE" ]; then
            if printf '%s' "$URL_PRODUZIONE" | grep -qF "$host_prova"; then stessa_produzione=si; fi
            if [ -n "$progetto_prova" ] && printf '%s' "$URL_PRODUZIONE" | grep -qF "$progetto_prova"; then stessa_produzione=si; fi
          fi
          if [ "$stessa_produzione" = si ]; then
            echo "::error::Il Supabase di prova punta allo stesso progetto della produzione ($host_prova). Gli smoke NON partono: scriverebbero sui dati veri."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT" 

      - name: Install Playwright (chromium)
        if: steps.e2e.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.e2e.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      - name: Start app + run e2e
        if: steps.e2e.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
          CRON_SECRET: "ci-e2e-cron-secret"
        run: |
          # #244 — `npm start` lancia un figlio (il server Next): chiudendo solo
          # npm, il server restava vivo e il lavoro finiva in timeout. Si chiude
          # il gruppo intero.
          set -m
          npm start &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          npm run test:e2e -- --project=chromium
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          exit $STATUS

      # #229 — Vedi il gemello nel job dei test d'integrazione: un verde che
      # non vuol dire «tutto provato» va detto dove si guarda, non nel log.
      - name: Dichiara cosa NON ha girato
        if: always()
        run: |
          {
            if [ "${{ steps.e2e.outputs.enabled }}" = "true" ]; then
              echo "✅ **Prove end-to-end col database di prova**: girate."
            else
              echo "⚠️ **Prove end-to-end col database di prova: NON girate.**"
              echo ""
              echo "Mancano i segreti \`SUPABASE_TEST_URL\` e \`SUPABASE_TEST_ANON_KEY\` (un progetto Supabase di PROVA, mai quello vero)."
              echo "Senza, l'ordine vero non nasce mai: nessuno ha visto un acquisto arrivare in fondo."
              echo "Il browser però ha guardato lo stesso — vedi il lavoro «Prove nel browser (senza chiavi)», che non dipende da nessun segreto."
            fi
            # 1/11/2026 — Le tre prove dell'acquisto vero (tests/e2e/12-…):
            # contrassegno, rimborso, bonifico al negozio. Oggi sono dichiarate
            # saltate alla nascita, perche' il loro corpo non e' ancora
            # scritto. Si dice qui, in cima, anche quando il resto e' verde.
            echo ""
            if [ -z "${E2E_DATI_DI_PROVA:-}" ]; then
              echo "⚠️ **Le tre prove dell'acquisto vero (contrassegno, rimborso, bonifico al negozio): NON girate.**"
              echo ""
              echo "Manca \`E2E_DATI_DI_PROVA\`, e comunque il loro corpo non e' ancora scritto: in questa CI nessun ordine e' mai nato, nessun rimborso e nessun bonifico sono stati visti."
            else
              echo "⚠️ **Le tre prove dell'acquisto vero: NON girate nemmeno con \`E2E_DATI_DI_PROVA\` acceso.** Il loro corpo non e' ancora scritto: restano saltate col motivo, non diventano verdi."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 3/9/2026 — LE PROVE NEL BROWSER NON POSSONO PIU' SPEGNERSI DA SOLE.
  #
  # Il lavoro qui sopra e' appeso a `steps.e2e.outputs.enabled`, che diventa
  # `false` quando mancano i segreti di un Supabase di prova: segreti che non
  # sono mai stati creati. Risultato: da mesi la CI diceva verde e nessun
  # browser apriva una sola pagina del sito. Nel frattempo le prove sono
  # invecchiate — accese a mano, 20 delle 68 erano rosse — e nessuna
  # attraversava la cassa.
  #
  # Questo lavoro fa la stessa cosa che il lavoro `a11y` ha fatto per axe
  # (R102): stacca da quei segreti tutto cio' che si puo' provare senza. E si
  # puo' provare quasi tutto: il sito si costruisce con variabili finte, si
  # accende in locale, e il carrello vive nel browser — quindi anche il tratto
  # che porta alla cassa si percorre senza database.
  #
  # NESSUN PASSO DI QUESTO LAVORO HA UN `if:` E NESSUNO LEGGE UN SEGRETO: e'
  # quello che lo tiene acceso, e la prova
  # tests/unit/le-prove-nel-browser-non-si-possono-piu-spegnere.test.ts diventa
  # rossa se qualcuno ne aggiunge uno.
  #
  # E non basta che giri: deve anche AVER PROVATO. L'ultimo passo conta le
  # prove davvero eseguite e fallisce se sono zero, cosi' una suite che si
  # auto-salta per intero non puo' piu' uscire con la stessa spunta di una che
  # ha guardato. Le saltate sono elencate con il loro motivo, una per una.
  #
  # 13/11/2026 — OTTO FETTE, NELLO STESSO MOMENTO. Le 76 prove giravano una
  # dopo l'altra in 3 minuti, dopo 2 di costruzione del sito. Adesso ogni
  # fetta costruisce il sito e fa girare un ottavo delle prove (sharding di
  # Playwright). Il conto di cosa ha guardato resta in ogni fetta, ed e' piu'
  # severo di prima: una fetta che non apre nessuna pagina si ferma rossa da
  # sola. Il lavoro «e2e-senza-chiavi-insieme» rimette insieme i referti e si
  # ferma rosso se una prova dell'elenco non ha girato in nessuna fetta.
  e2e-senza-chiavi:
    name: Prove nel browser (senza chiavi) — non si spegne mai (fetta ${{ matrix.fetta }})
    # 13/11/2026 — Ubuntu 24.04 fisso: su 26.04 Playwright non installa Chromium
    # («Playwright does not support chromium on ubuntu26.04-x64»).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fetta: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 13/11/2026 — La cache di compilazione di Next (.next/cache) si
      # riprende dall'ultima costruzione fatta: e' quella che Next stesso
      # consiglia di tenere fra un giro e l'altro della CI. Non cambia cosa si
      # costruisce, solo quanto si ricompila da zero. Quale chiave e perche':
      # vedi il commento al lavoro «lint-and-typecheck».
      - name: Riprendi la cache di compilazione di Next
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .next/cache/webpack
            .next/cache/swc
            .next/cache/.tsbuildinfo
          key: next-build-v2-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.ref == 'refs/heads/main' && github.sha || github.head_ref || github.ref_name }}
          restore-keys: |
            next-build-v2-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # 13/11/2026 — Chromium si tiene in cache come i pacchetti npm: la stessa
      # versione di Playwright (fissata da package-lock.json) vuole lo stesso
      # Chromium, e riscaricarlo e scompattarlo a ogni giro rubava tempo e
      # processore alla costruzione del sito. `playwright install --with-deps`
      # piu' sotto gira lo stesso: installa le librerie di sistema e, se il
      # browser in cache mancasse, lo riscarica.
      - name: Riprendi Chromium dalla cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # Variabili finte, scritte in chiaro qui dentro: non sono un segreto
      # dimenticato, sono la scelta. Il giorno che qualcuno togliesse un segreto
      # dalle impostazioni del repository, questo lavoro girerebbe identico.
      #
      # Chromium si scarica mentre Next costruisce il sito: sono due attese che
      # non dipendono l'una dall'altra, e prima si facevano in fila. Se Chromium
      # non si installa, il passo si ferma rosso e stampa perche'.
      - name: Installa Chromium e costruisci il sito con variabili finte
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://prove-nel-browser-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-le-prove-nel-browser"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1 &
          CHROMIUM=$!
          npm run build
          if ! wait "$CHROMIUM"; then
            cat "$RUNNER_TEMP/chromium.log"
            echo "::error::Chromium non si e' installato: le prove nel browser non possono partire."
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/chromium.log"

      # Un passo solo: accende il sito, lo percorre col browser, conta cosa ha
      # provato davvero e poi decide. Sta tutto insieme apposta — un passo di
      # resoconto a parte avrebbe avuto bisogno di `if: always()`, cioe' proprio
      # di quella condizione che questo lavoro non deve avere.
      - name: Percorri il sito nel browser e dichiara cosa hai provato
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://prove-nel-browser-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-le-prove-nel-browser"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
          CRON_SECRET: "ci-e2e-cron-secret"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "esito-prove-browser.json"
          FETTA_INDICE: ${{ strategy.job-index }}
          FETTE_TOTALI: ${{ strategy.job-total }}
          COMMIT: ${{ github.sha }}
          REFERTO: ${{ runner.temp }}/referto-browser
        run: |
          # Il referto della fetta: quale fetta e', l'elenco di TUTTE le prove
          # (per chi rimette insieme le fette) e, piu' sotto, il suo esito.
          mkdir -p "$REFERTO"
          printf '{"indice":%s,"totale":%s,"commit":"%s","radice":"%s"}\n' \
            "$FETTA_INDICE" "$FETTE_TOTALI" "$COMMIT" "$PWD" > "$REFERTO/fetta.json"
          PLAYWRIGHT_JSON_OUTPUT_NAME="$REFERTO/universo.json" \
            npx playwright test --list --project=chromium --reporter=json > /dev/null \
            || { echo "::error::non riesco a elencare le prove nel browser"; exit 1; }

          # `npm start` lancia un figlio (il server Next): chiudendo solo npm il
          # server resta vivo e il lavoro finisce in timeout. Si chiude il gruppo.
          set -m
          npm start &
          APP_PID=$!
          su=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then su="si"; break; fi
            sleep 1
          done
          if [ -z "$su" ]; then
            echo "::error::l'app non ha risposto entro 60 secondi: nessuna prova nel browser ha potuto girare"
            kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:e2e -- --project=chromium --reporter=github,json \
            --shard="$((FETTA_INDICE + 1))/$FETTE_TOTALI"
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          set -e
          cp esito-prove-browser.json "$REFERTO/esito.json" 2>/dev/null || true

          # Il conto vero: quante prove hanno guardato, quante sono rosse e
          # quali sono state saltate — con il motivo scritto accanto a ognuna.
          # Serve a rendere impossibile la cosa da cui nasce tutto questo
          # lavoro: una spunta verde su una suite che non ha aperto niente.
          cat > /tmp/riassumi-prove-browser.mjs <<'FINE_SCRIPT'
          import { readFileSync, appendFileSync } from 'node:fs';

          const [percorso, statoDetto] = process.argv.slice(2);
          const esito = JSON.parse(readFileSync(percorso, 'utf8'));

          /** Scende in tutti i gruppi annidati e restituisce le singole prove. */
          function tutteLeProve(gruppi = []) {
            return gruppi.flatMap((g) => [
              ...(g.specs ?? []).flatMap((s) =>
                (s.tests ?? []).map((t) => ({
                  nome: `${(s.file ?? g.file ?? '').replace('tests/e2e/', '')} › ${s.title}`,
                  stato: t.status,
                  motivo:
                    (t.annotations ?? []).find((a) => a.type === 'skip')?.description ??
                    (t.results ?? []).flatMap((r) => r.annotations ?? []).find((a) => a.type === 'skip')
                      ?.description ??
                    '',
                })),
              ),
              ...tutteLeProve(g.suites ?? []),
            ]);
          }

          const prove = tutteLeProve(esito.suites);
          const saltate = prove.filter((p) => p.stato === 'skipped');
          const rosse = prove.filter((p) => p.stato === 'unexpected' || p.stato === 'timedOut');
          const ballerine = prove.filter((p) => p.stato === 'flaky');
          const passate = prove.filter((p) => p.stato === 'expected');
          const hannoGuardato = prove.length - saltate.length;

          const righe = [];
          righe.push(`### Prove nel browser (senza chiavi) — fetta ${Number(process.env.FETTA_INDICE) + 1} di ${process.env.FETTE_TOTALI}`);
          righe.push('');
          righe.push(`- **${passate.length} passate** su ${prove.length} scritte`);
          righe.push(`- **${rosse.length} rosse**`);
          if (ballerine.length > 0) righe.push(`- **${ballerine.length} ballerine** (verdi solo al secondo tentativo)`);
          righe.push(`- **${saltate.length} saltate**, e qui sotto c'è il perché di ognuna:`);
          righe.push('');
          for (const p of saltate) {
            righe.push(`  - \`${p.nome}\` — ${p.motivo || 'saltata senza motivo dichiarato'}`);
          }
          righe.push('');
          righe.push(
            hannoGuardato > 0
              ? `${hannoGuardato} prove hanno davvero aperto una pagina o interrogato il server. Nessun segreto è stato usato.`
              : 'NESSUNA prova ha guardato niente.',
          );
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, righe.join('\n') + '\n');
          }
          console.log(righe.join('\n'));

          // ① Una suite che si salta per intero non può uscire con la stessa
          //    spunta di una che ha provato. È il difetto di partenza, e qui
          //    diventa rosso invece che verde.
          if (hannoGuardato === 0) {
            console.log('::error::le prove nel browser si sono saltate tutte: nessuna pagina è stata aperta, e un verde qui sarebbe una bugia');
            process.exit(1);
          }
          // ② Una prova saltata senza motivo scritto è un interruttore
          //    travestito: chi la salta deve dire perché.
          const mute = saltate.filter((p) => !p.motivo);
          if (mute.length > 0) {
            for (const p of mute) console.log(`::error::«${p.nome}» è saltata senza dire perché`);
            process.exit(1);
          }
          process.exit(Number(statoDetto) === 0 ? 0 : 1);
          FINE_SCRIPT
          node /tmp/riassumi-prove-browser.mjs esito-prove-browser.json "$STATUS"

      - name: Consegna il referto della fetta
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: referto-browser-${{ strategy.job-index }}
          path: ${{ runner.temp }}/referto-browser
          if-no-files-found: error
          retention-days: 3

  # 31/8/2026 (R102) — L'ACCESSIBILITA' HA UN LAVORO SUO, E NON PUO' SPEGNERSI.
  #
  # axe viveva dentro il lavoro qui sopra, dove ogni passo e' appeso a
  # `steps.e2e.outputs.enabled == 'true'`. Quel valore diventa `false` quando
  # mancano i segreti di un Supabase di prova, che non ci sono mai stati:
  # nell'esecuzione 33053827261 su `main` il lavoro risultava SUCCESS con
  # «Install Playwright», «Build» e «Start app + run e2e» tutti SKIPPED. La
  # Dichiarazione di Accessibilita' promette la conformita' all'European
  # Accessibility Act, e l'unica prova che poteva smentirla non ha mai aperto un
  # browser.
  #
  # Qui l'accessibilita' e' staccata dagli smoke: quelli hanno bisogno di dati
  # veri per avere senso, axe no. Nomi, ruoli, contrasto, landmark e ordine dei
  # titoli si controllano identici su un sito vuoto, e le variabili sono finte
  # apposta. NESSUN PASSO DI QUESTO LAVORO HA UN `if:` E NESSUNO LEGGE UN
  # SEGRETO: e' quello che lo tiene acceso, e la prova
  # tests/unit/il-cancello-dell-accessibilita-gira-sempre.test.ts diventa rossa
  # se qualcuno ne aggiunge uno.
  a11y:
    name: Accessibilita (axe) — non si spegne mai
    # 13/11/2026 — Ubuntu 24.04 fisso: su 26.04 Playwright non installa Chromium
    # («Playwright does not support chromium on ubuntu26.04-x64»).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # 13/11/2026 — Stessa cache di compilazione di Next delle prove nel
      # browser: vedi il commento al lavoro «lint-and-typecheck».
      - name: Riprendi la cache di compilazione di Next
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .next/cache/webpack
            .next/cache/swc
            .next/cache/.tsbuildinfo
          key: next-build-v2-axe-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.ref == 'refs/heads/main' && github.sha || github.head_ref || github.ref_name }}
          restore-keys: |
            next-build-v2-axe-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # 13/11/2026 — Chromium si tiene in cache come i pacchetti npm: la stessa
      # versione di Playwright (fissata da package-lock.json) vuole lo stesso
      # Chromium, e riscaricarlo e scompattarlo a ogni giro rubava tempo e
      # processore alla costruzione del sito. `playwright install --with-deps`
      # piu' sotto gira lo stesso: installa le librerie di sistema e, se il
      # browser in cache mancasse, lo riscarica.
      - name: Riprendi Chromium dalla cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-playwright-v1-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # Variabili finte, scritte in chiaro qui dentro: non sono un segreto
      # dimenticato, sono la scelta. Il giorno che qualcuno rimuovesse un
      # segreto dalle impostazioni del repository, questo lavoro continuerebbe a
      # girare identico.
      #
      # 13/11/2026 — Chromium si scarica mentre Next costruisce il sito, come
      # nelle prove nel browser: prima le due attese si facevano in fila.
      - name: Installa Chromium e costruisci il sito con variabili finte
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://accessibilita-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-il-cancello-accessibilita"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium > "$RUNNER_TEMP/chromium.log" 2>&1 &
          CHROMIUM=$!
          npm run build
          if ! wait "$CHROMIUM"; then
            cat "$RUNNER_TEMP/chromium.log"
            echo "::error::Chromium non si e' installato: axe non puo' aprire le pagine."
            exit 1
          fi
          tail -n 5 "$RUNNER_TEMP/chromium.log"

      - name: Apri ogni pagina con axe
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://accessibilita-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-il-cancello-accessibilita"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
        run: |
          # `npm start` lancia un figlio (il server Next): chiudendo solo npm il
          # server resta vivo e il lavoro finisce in timeout. Si chiude il gruppo.
          set -m
          npm start &
          APP_PID=$!
          su=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then su="si"; break; fi
            sleep 1
          done
          if [ -z "$su" ]; then
            echo "::error::l'app non ha risposto entro 60 secondi: axe non ha potuto guardare niente"
            kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:e2e -- tests/e2e/11-a11y-percorso-acquisto.spec.ts --project=chromium
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          exit $STATUS

      # Il difetto era «un verde che non prova niente». L'antidoto e' dire, dove
      # si guarda, che stavolta ha provato — e su quante pagine.
      - name: Dichiara che l'accessibilita e' stata provata
        run: |
          pagine=$(grep -cE "^  \{ nome:" tests/e2e/11-a11y-percorso-acquisto.spec.ts || true)
          {
            echo "✅ **Accessibilita (axe)**: girata su $pagine pagine, senza nessun segreto e senza nessuna condizione."
          } >> "$GITHUB_STEP_SUMMARY"

  # 13/11/2026 — LE FETTE SI RIMETTONO INSIEME, E NESSUNA PROVA SI PERDE.
  #
  # Le prove unitarie e quelle nel browser girano divise in fette. Ogni fetta,
  # da sola, puo' uscire verde anche se un pezzo di prove non ha girato da
  # nessuna parte: una fetta che prende la parte sbagliata, o una in meno di
  # quelle che servono. Con un lavoro unico non poteva succedere.
  #
  # Questi due lavori leggono il referto di ogni fetta e si fermano ROSSI se:
  # manca una fetta o ce n'e' una doppia, le fette non hanno girato sullo
  # stesso commit o non vedevano lo stesso elenco di prove, una prova
  # dell'elenco non ha girato o ha girato due volte. Lo fa
  # scripts/ricuci-fette-ci.mjs, e la prova
  # tests/unit/le-fette-della-ci-non-perdono-prove.test.ts lo rompe apposta in
  # ognuno di quei modi.
  #
  # Nessun `if:` qui: se una fetta e' rossa questi lavori non partono, e il
  # cancello «Main» si ferma comunque sulla fetta rossa, che aspetta anche lei.
  unit-tests-insieme:
    name: Unit tests — le fette messe insieme
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Serve solo lo script che rimette insieme le fette: niente pacchetti npm,
      # basta il Node che la macchina di GitHub ha gia'.
      - name: Checkout (solo lo script che rimette insieme le fette)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ricuci-fette-ci.mjs
            scripts/ricuci-fette-ci.lib.mjs
          sparse-checkout-cone-mode: false

      - name: Prendi i referti delle fette
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: referto-unitari-*
          path: ${{ runner.temp }}/referti-unitari

      - name: Ogni file di prova ha girato, una volta sola
        env:
          REFERTI: ${{ runner.temp }}/referti-unitari
        run: |
          node --version
          node scripts/ricuci-fette-ci.mjs vitest "$REFERTI"

  e2e-senza-chiavi-insieme:
    name: Prove nel browser — le fette messe insieme
    needs: e2e-senza-chiavi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Serve solo lo script che rimette insieme le fette: niente pacchetti npm,
      # basta il Node che la macchina di GitHub ha gia'.
      - name: Checkout (solo lo script che rimette insieme le fette)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/ricuci-fette-ci.mjs
            scripts/ricuci-fette-ci.lib.mjs
          sparse-checkout-cone-mode: false

      - name: Prendi i referti delle fette
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: referto-browser-*
          path: ${{ runner.temp }}/referti-browser

      - name: Ogni prova nel browser ha girato, una volta sola
        env:
          REFERTI: ${{ runner.temp }}/referti-browser
        run: |
          node --version
          node scripts/ricuci-fette-ci.mjs playwright "$REFERTI"

  # 15/10/2026 (R57) — LA REGOLA «MAIN» ASPETTAVA UN CONTROLLO CHE NON ARRIVAVA MAI.
  #
  # Su GitHub esiste dal 26/5 una regola chiamata «Main» (Settings → Rules →
  # Rulesets) che pretende, prima di unire, un controllo verde di nome «Main».
  # Nessun lavoro di questo file si chiamava cosi': i nomi erano «Lint +
  # Typecheck + Build», «Unit tests» e gli altri qui sopra. Accesa cosi' com'era
  # sul ramo main, la regola avrebbe bloccato OGNI unione, per sempre, in
  # «Expected — Waiting for status to be reported». E intanto, spenta, non
  # fermava niente: nessuna richiesta con la CI rossa trovava il pulsante di
  # unione chiuso.
  #
  # Questo lavoro e' il controllo «Main». Aspetta TUTTI i lavori qui sopra e
  # da' il via libera solo se nessuno e' fallito o e' stato annullato. Cosi' la
  # regola pretende un nome solo, e un lavoro aggiunto domani entra nel cancello
  # aggiungendolo a `needs` — la prova
  # tests/unit/la-regola-main-aspetta-un-controllo-che-esiste.test.ts diventa
  # rossa se qualcuno se ne dimentica.
  #
  # PERCHE' `if: always()`. Senza, quando un lavoro richiesto fallisce GitHub
  # SALTA questo lavoro invece di eseguirlo — e un controllo obbligatorio
  # saltato, per la regola, vale come passato. Il cancello si aprirebbe proprio
  # quando deve restare chiuso. Con `always()` gira sempre e decide lui.
  #
  # Un lavoro SALTATO invece non blocca: e' il caso di un lavoro con una sua
  # condizione che non si avvera. Ma se fossero saltati tutti, non avrebbe
  # controllato niente nessuno, e quello non e' un via libera.
  #
  # COSA NON FERMA. Questo lavoro, con la regola accesa, ferma le RICHIESTE
  # rosse. Non ferma un rosso che compare su main dopo l'unione: il 1/9 la CI
  # di main e' finita rossa alle 18:11 per una prova che si rompeva da sola nei
  # minuti :10-:11 di ogni ora (riparata nel commit 94e56c6), con la richiesta
  # #245 verde e sana, e Vercel ha pubblicato lo stesso. Quello lo ferma solo
  # il rilascio che aspetta la CI verde di main (deploy-dopo-ci.yml) con
  # "main": false in vercel.json. Il nome «Main» e la regola si controllano con
  # scripts/controlla-regola-main.mjs, che legge la regola com'e' su GitHub.
  cancello-main:
    name: Main
    needs:
      - lint-and-typecheck
      - unit-tests
      - integration-tests
      - rls-locale
      - e2e-tests
      - e2e-senza-chiavi
      - a11y
      - unit-tests-insieme
      - e2e-senza-chiavi-insieme
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tutti i controlli obbligatori sono passati
        env:
          ESITI: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          # ESITI e' l'esito di ogni lavoro aspettato, scritto da GitHub:
          #   {"unit-tests": {"result": "success", "outputs": {}}, ...}
          # Se non si legge, o e' vuoto, il cancello resta chiuso: un via
          # libera dato senza aver guardato e' la spunta bugiarda di sempre.
          if ! RIGHE="$(printf '%s' "${ESITI:-}" | jq -er 'to_entries[] | "\(.key) \(.value.result // "sconosciuto")"' 2>/dev/null)"; then
            echo "::error::Non riesco a leggere l'esito dei controlli: niente via libera per main."
            exit 1
          fi
          PASSATI=0
          FERMI=""
          while read -r LAVORO ESITO; do
            case "$ESITO" in
              success) PASSATI=$((PASSATI + 1)); echo "✅ $LAVORO" ;;
              skipped) echo "⏭️  $LAVORO: saltato, non blocca" ;;
              *) echo "❌ $LAVORO: $ESITO"; FERMI="$FERMI $LAVORO ($ESITO)" ;;
            esac
          done <<< "$RIGHE"
          if [ -n "$FERMI" ]; then
            echo "::error::Controlli non passati:$FERMI. Niente via libera per main."
            echo "## ⛔ Niente via libera: controlli non passati:$FERMI" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            exit 1
          fi
          if [ "$PASSATI" -eq 0 ]; then
            echo "::error::Nessun controllo e' passato davvero: sono stati tutti saltati. Niente via libera per main."
            exit 1
          fi
          echo "Via libera: $PASSATI controlli passati."
