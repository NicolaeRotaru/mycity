name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]


# 27/8/2026 (R188) — Sui rami di lavoro l'ultimo invio e' l'unico che interessa:
# i controlli sui commit gia' superati bruciano minuti e basta. Su `main` vale
# il contrario e la condizione lo dice: quelle esecuzioni NON si annullano mai,
# perche' il rilascio in produzione parte proprio dal loro esito — annullarne
# una vorrebbe dire fermare un rilascio a caso.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


# #244 — Il minimo indispensabile. Senza questo blocco ogni lavoro parte col
# permesso predefinito del repository, che di norma è di SCRITTURA: uno script
# di una dipendenza compromessa potrebbe scrivere sul codice o creare rilasci.
# Qui serve solo leggere.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #139 — PERCHE' 22 E NON 20 (21/8/2026).
      #
      # Le prove sui permessi visti da fuori, appena hanno cominciato a girare
      # davvero, si sono fermate qui:
      #
      #   Error: Node.js 20 detected without native WebSocket support.
      #
      # Il client Supabase costruisce il pezzo «tempo reale» gia' nel
      # costruttore, e quello vuole un WebSocket che Node 20 non ha. Non era un
      # difetto nuovo: sarebbe uscito identico con un progetto di prova a
      # pagamento. Si vedeva solo adesso perche' prima quelle prove si
      # saltavano.
      #
      # Riprodotto a mano prima di cambiare: su Node 20 il client non si
      # costruisce, su Node 22 si'.
      #
      # POI L'HO CHIUSA DEL TUTTO. Nel primo giro avevo messo 22 e scritto che
      # la distanza con la produzione — che gira su Node 24 — restava aperta
      # perche' non avevo un Node 24 con cui provare. Non era vero: bastava
      # scaricarlo. Provato, e passa tutto:
      #
      #   943 prove unitarie verdi · typecheck pulito · lint senza errori ·
      #   build di produzione riuscita, 173 pagine statiche generate
      #
      # Adesso la CI prova sulla stessa versione che serve i clienti. Il
      # `engines` del progetto dice >=20, quindi 24 e' dentro le regole.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Storybook 8.x dichiara peer deps su React 18 + ecc, ma il monorepo usa
      # react-dom 18.3 risolto via Next 14; senza --legacy-peer-deps fallisce.
      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      # Build verifica typecheck + bundling.
      # Le env var pubbliche di Supabase devono essere presenti in build perché
      # Next inline-a process.env.NEXT_PUBLIC_* nei chunk client.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
          # i NEXT_PUBLIC_* sopra sono placeholder solo per superare il build;
          # in produzione vengono dal hosting (Vercel → Settings → Environment
          # Variables). Mai mettere chiavi reali qui.
        run: npm run build

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # Unit test puri (niente DB/network) + guardia integrita' file migration.
      - name: Test
        run: npm run test

  integration-tests:
    name: Integration tests (DB)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # 🔴-4: i test RLS/grant non devono auto-skipparsi in SILENZIO (CI verde con
      # RLS rotta). Se ci sono i secret di un progetto Supabase DI TEST → girano e
      # fanno enforcement. Se mancano → warning VISIBILE + skip: niente false-green
      # silenzioso, ma non blocchiamo i merge di chi non ha ancora un DB di test.
      - name: Check RLS secrets
        id: rls
        # Segreti con nomi DEDICATI alla prova (suffisso _TEST). Prima si usavano
        # gli stessi nomi della produzione, chiave di servizio compresa: un
        # errore di configurazione e i test scrivevano sul database dei clienti.
        # Il commento diceva «progetto di TEST», ma niente lo verificava.
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
          ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SR: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$ANON" ] || [ -z "$SR" ]; then
            echo "::warning::Test d'integrazione su Supabase SALTATI: mancano SUPABASE_TEST_URL, SUPABASE_TEST_ANON_KEY, SUPABASE_TEST_SERVICE_ROLE_KEY. I controlli di permessi girano comunque nel job 'Controlli database (Postgres locale)', che non usa chiavi."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # Test d'integrazione di sicurezza (RLS + grant EXECUTE su SECURITY DEFINER)
      # contro il DB di test. Girano SOLO se i secret ci sono (vedi step sopra).
      - name: Integration tests
        if: steps.rls.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
        run: npm run test:integration

      # #139 — SENZA I SEGRETI LE PROVE NON SI SALTANO PIU': LA CI SI AVVIA UN
      # SUPABASE SUO.
      #
      # Prima qui c'era solo un bivio: coi segreti di un progetto di prova le
      # prove giravano, senza si saltavano con un avviso. Sono sempre mancati,
      # quindi non hanno mai girato — e il verde della CI copriva dei permessi
      # che nessuno aveva guardato da fuori.
      #
      # Adesso la CI se lo avvia da sola dentro il runner: vive quanto il giro e
      # poi sparisce. Non costa niente (un progetto di prova costa 10 dollari al
      # mese), non ha nessuna chiave da custodire su GitHub, e nasce vuoto ogni
      # volta, quindi due giri non possono sporcarsi a vicenda.
      #
      # I segreti restano ammessi e hanno la precedenza: se un giorno esistono,
      # gira il passo qui sopra e questo non parte.
      - name: Avvia un Supabase locale
        if: steps.rls.outputs.enabled != 'true'
        run: bash tests/supabase-locale/avvia.sh

      - name: I permessi visti da fuori, contro il Supabase locale
        id: locale
        if: steps.rls.outputs.enabled != 'true'
        run: npm run test:integration

      # #229 — UN SEGNO VERDE CHE NON VUOL DIRE «TUTTO PROVATO».
      #
      # Due gruppi di prove si auto-saltano quando mancano i segreti, e finora
      # lo dicevano solo con un avviso dentro il log — dove non guarda nessuno.
      # Fuori restava una spunta verde identica a quella di una CI che ha
      # provato tutto. Adesso, quando qualcosa non ha girato, sta scritto in
      # cima al riepilogo della CI, che è la prima cosa che si vede.
      - name: Dichiara cosa NON ha girato
        if: always()
        run: |
          {
            if [ "${{ steps.rls.outputs.enabled }}" = "true" ]; then
              echo "✅ **Prove d'integrazione sui permessi**: girate, contro il progetto di prova dei segreti."
            elif [ "${{ steps.locale.outcome }}" = "success" ]; then
              echo "✅ **Prove d'integrazione sui permessi**: girate, contro un Supabase avviato qui dentro."
            else
              echo "⚠️ **Prove d'integrazione sui permessi: NON girate.**"
              echo ""
              echo "Nessun segreto di un progetto di prova, e il Supabase locale non e' partito."
              echo "Il verde qui sopra non dice che i permessi sul database sono a posto: dice che non sono stati provati."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  rls-locale:
    name: Controlli database (Postgres locale, senza chiavi)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Perche' questo job esiste: i test di sicurezza sul database si
    # auto-skippavano quando mancavano i segreti di un progetto di prova. Un
    # verde che non provava niente — e proprio sui controlli che tengono chiusi
    # i dati dei clienti. Qui si ricostruisce lo schema VERO dalle migrazioni su
    # un Postgres del runner: nessuna chiave, nessuna rete, e non si salta mai.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installa il client psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # Ricostruisce il database da zero: impalcatura Supabase + tutte le
      # migrazioni nell'ordine vero. Fallisce se una migrazione non si applica —
      # e cinque non si applicavano, fermandosi a meta' file.
      - name: Ricostruisci lo schema dalle migrazioni
        run: bash tests/sql/harness/apply.sh mycity_ci

      # I controlli di comportamento: si apre una sessione col ruolo di un
      # estraneo e si prova a fare il danno.
      - name: Controlli di permessi e privacy
        run: bash tests/sql/harness/run.sh mycity_ci

      # La ricostruzione qui sopra parte da tabelle VUOTE: una migrazione che
      # riscrive righe esistenti li' non riscrive niente, e passa comunque. La
      # 124 e' passata cosi' e si e' fermata sul primo database con dentro un
      # ordine vero. Qui l'ultima migrazione si applica su un database che ha
      # gia' dei dati, che e' il giro che fa la produzione.
      - name: L'ultima migrazione regge un database con dentro degli ordini
        run: bash tests/sql/harness/migrazione-su-database-pieno.sh mycity_pieno_ci

      # 28/8/2026 — L'IDEMPOTENZA DEL RILASCIO SI PROVA, NON SI DICHIARA.
      #
      # Il passo del rilascio applicava TUTTI i file a ogni pubblicazione, con
      # un commento che diceva «le migrazioni del progetto sono idempotenti».
      # Non lo sono: la 001 e la 002 creano tabelle senza `IF NOT EXISTS`, e su
      # un database che le ha gia' — la produzione — psql muore sul primo file.
      # Nessuno se ne era accorto perche' quel lavoro non gira (mancano i
      # segreti): sarebbe esploso il giorno in cui li si configura, cioe'
      # proprio mentre si spegne il rilascio automatico.
      #
      # Qui lo script del rilascio gira DUE VOLTE sullo stesso database: la
      # seconda deve applicare zero file e uscire verde.
      - name: Il rilascio riapplicato due volte non si rompe
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/mycity_ci
        run: |
          bash scripts/applica-migrazioni-mancanti.sh | tee /tmp/giro1.txt
          bash scripts/applica-migrazioni-mancanti.sh | tee /tmp/giro2.txt
          grep -q "applicate 0 " /tmp/giro2.txt \
            || { echo "::error::il secondo giro ha riapplicato delle migrazioni: il rilascio non e' ripetibile"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # #233 — Attenzione a cosa prova questo passo: gira contro il database
      # che la CI ha appena ricostruito applicando TUTTE le migrazioni del
      # repo. Quindi non puo' diventare rosso per definizione: confronta il
      # repo con una copia del repo. E' un controllo di coerenza interna, non
      # la sentinella delle migrazioni dimenticate in produzione — quella e' un
      # lavoro a parte (.github/workflows/deriva-migrazioni-produzione.yml),
      # perche' richiede il segreto del database vero.
      - name: Coerenza interna delle migrazioni (NON e' il controllo su produzione)
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@localhost:5432/mycity_ci
        run: npm run db:check-drift

      # #4 — I tipi del database sono generati dalle migrazioni, ma nessuno
      # controllava che fossero aggiornati. Peggio: il generatore perdeva
      # silenziosamente le colonne dichiarate in fila nella stessa istruzione
      # `alter table` — fra cui `seller_payout_cents`, che cinque file di
      # codice nominano. Il file si generava lo stesso e nessuno se ne
      # accorgeva. Adesso: si rigenera, e se il risultato e' diverso da quello
      # committato il passo diventa rosso.
      - name: I tipi del database sono aggiornati
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts \
            || { echo "::error::lib/database.types.ts non e' aggiornato: esegui 'npm run db:types' e committa il risultato."; exit 1; }

  e2e-tests:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      # 🔴-4: gli smoke e2e richiedono un backend reale (la home/cart/auth
      # renderizzano dati dal DB). Se ci sono i secret di un Supabase di TEST →
      # build + avvio app + Playwright. Se mancano → warning VISIBILE + skip,
      # così il job non blocca i merge ma resta pronto ad attivarsi.
      # #240 — I segreti si chiamavano come quelli di produzione
      # (NEXT_PUBLIC_SUPABASE_URL/ANON_KEY): chi li configurava incollava le
      # chiavi vere, e gli smoke andavano a scrivere sul database dei clienti.
      # Ora i nomi dicono cosa sono, e c'e' un controllo che rifiuta di partire
      # se l'indirizzo coincide con quello di produzione.
      - name: Check E2E secrets
        id: e2e
        env:
          URL: ${{ secrets.SUPABASE_TEST_URL }}
          ANON: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          URL_PRODUZIONE: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$URL" ] || [ -z "$ANON" ]; then
            echo "::warning::E2E smoke SALTATI: servono SUPABASE_TEST_URL e SUPABASE_TEST_ANON_KEY (un progetto Supabase di PROVA, mai quello vero)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          host_prova="$(printf '%s' "$URL" | sed -E 's#^https?://##' | cut -d/ -f1)"
          if [ -n "$URL_PRODUZIONE" ] && printf '%s' "$URL_PRODUZIONE" | grep -qF "$host_prova"; then
            echo "::error::Il Supabase di prova punta allo stesso host della produzione ($host_prova). Gli smoke NON partono: scriverebbero sui dati veri."
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT" 

      - name: Install Playwright (chromium)
        if: steps.e2e.outputs.enabled == 'true'
        run: npx playwright install --with-deps chromium

      - name: Build
        if: steps.e2e.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      - name: Start app + run e2e
        if: steps.e2e.outputs.enabled == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
          CRON_SECRET: "ci-e2e-cron-secret"
        run: |
          # #244 — `npm start` lancia un figlio (il server Next): chiudendo solo
          # npm, il server restava vivo e il lavoro finiva in timeout. Si chiude
          # il gruppo intero.
          set -m
          npm start &
          APP_PID=$!
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then break; fi
            sleep 1
          done
          set +e
          npm run test:e2e -- --project=chromium
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          exit $STATUS

      # #229 — Vedi il gemello nel job dei test d'integrazione: un verde che
      # non vuol dire «tutto provato» va detto dove si guarda, non nel log.
      - name: Dichiara cosa NON ha girato
        if: always()
        run: |
          {
            if [ "${{ steps.e2e.outputs.enabled }}" = "true" ]; then
              echo "✅ **Prove end-to-end col database di prova**: girate."
            else
              echo "⚠️ **Prove end-to-end col database di prova: NON girate.**"
              echo ""
              echo "Mancano i segreti \`SUPABASE_TEST_URL\` e \`SUPABASE_TEST_ANON_KEY\` (un progetto Supabase di PROVA, mai quello vero)."
              echo "Senza, l'ordine vero non nasce mai: nessuno ha visto un acquisto arrivare in fondo."
              echo "Il browser però ha guardato lo stesso — vedi il lavoro «Prove nel browser (senza chiavi)», che non dipende da nessun segreto."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 3/9/2026 — LE PROVE NEL BROWSER NON POSSONO PIU' SPEGNERSI DA SOLE.
  #
  # Il lavoro qui sopra e' appeso a `steps.e2e.outputs.enabled`, che diventa
  # `false` quando mancano i segreti di un Supabase di prova: segreti che non
  # sono mai stati creati. Risultato: da mesi la CI diceva verde e nessun
  # browser apriva una sola pagina del sito. Nel frattempo le prove sono
  # invecchiate — accese a mano, 20 delle 68 erano rosse — e nessuna
  # attraversava la cassa.
  #
  # Questo lavoro fa la stessa cosa che il lavoro `a11y` ha fatto per axe
  # (R102): stacca da quei segreti tutto cio' che si puo' provare senza. E si
  # puo' provare quasi tutto: il sito si costruisce con variabili finte, si
  # accende in locale, e il carrello vive nel browser — quindi anche il tratto
  # che porta alla cassa si percorre senza database.
  #
  # NESSUN PASSO DI QUESTO LAVORO HA UN `if:` E NESSUNO LEGGE UN SEGRETO: e'
  # quello che lo tiene acceso, e la prova
  # tests/unit/le-prove-nel-browser-non-si-possono-piu-spegnere.test.ts diventa
  # rossa se qualcuno ne aggiunge uno.
  #
  # E non basta che giri: deve anche AVER PROVATO. L'ultimo passo conta le
  # prove davvero eseguite e fallisce se sono zero, cosi' una suite che si
  # auto-salta per intero non puo' piu' uscire con la stessa spunta di una che
  # ha guardato. Le saltate sono elencate con il loro motivo, una per una.
  e2e-senza-chiavi:
    name: Prove nel browser (senza chiavi) — non si spegne mai
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      # Variabili finte, scritte in chiaro qui dentro: non sono un segreto
      # dimenticato, sono la scelta. Il giorno che qualcuno togliesse un segreto
      # dalle impostazioni del repository, questo lavoro girerebbe identico.
      - name: Build con variabili finte
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://prove-nel-browser-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-le-prove-nel-browser"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      # Un passo solo: accende il sito, lo percorre col browser, conta cosa ha
      # provato davvero e poi decide. Sta tutto insieme apposta — un passo di
      # resoconto a parte avrebbe avuto bisogno di `if: always()`, cioe' proprio
      # di quella condizione che questo lavoro non deve avere.
      - name: Percorri il sito nel browser e dichiara cosa hai provato
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://prove-nel-browser-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-le-prove-nel-browser"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
          CRON_SECRET: "ci-e2e-cron-secret"
          PLAYWRIGHT_JSON_OUTPUT_NAME: "esito-prove-browser.json"
        run: |
          # `npm start` lancia un figlio (il server Next): chiudendo solo npm il
          # server resta vivo e il lavoro finisce in timeout. Si chiude il gruppo.
          set -m
          npm start &
          APP_PID=$!
          su=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then su="si"; break; fi
            sleep 1
          done
          if [ -z "$su" ]; then
            echo "::error::l'app non ha risposto entro 60 secondi: nessuna prova nel browser ha potuto girare"
            kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:e2e -- --project=chromium --reporter=github,json
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          set -e

          # Il conto vero: quante prove hanno guardato, quante sono rosse e
          # quali sono state saltate — con il motivo scritto accanto a ognuna.
          # Serve a rendere impossibile la cosa da cui nasce tutto questo
          # lavoro: una spunta verde su una suite che non ha aperto niente.
          cat > /tmp/riassumi-prove-browser.mjs <<'FINE_SCRIPT'
          import { readFileSync, appendFileSync } from 'node:fs';

          const [percorso, statoDetto] = process.argv.slice(2);
          const esito = JSON.parse(readFileSync(percorso, 'utf8'));

          /** Scende in tutti i gruppi annidati e restituisce le singole prove. */
          function tutteLeProve(gruppi = []) {
            return gruppi.flatMap((g) => [
              ...(g.specs ?? []).flatMap((s) =>
                (s.tests ?? []).map((t) => ({
                  nome: `${(s.file ?? g.file ?? '').replace('tests/e2e/', '')} › ${s.title}`,
                  stato: t.status,
                  motivo:
                    (t.annotations ?? []).find((a) => a.type === 'skip')?.description ??
                    (t.results ?? []).flatMap((r) => r.annotations ?? []).find((a) => a.type === 'skip')
                      ?.description ??
                    '',
                })),
              ),
              ...tutteLeProve(g.suites ?? []),
            ]);
          }

          const prove = tutteLeProve(esito.suites);
          const saltate = prove.filter((p) => p.stato === 'skipped');
          const rosse = prove.filter((p) => p.stato === 'unexpected' || p.stato === 'timedOut');
          const ballerine = prove.filter((p) => p.stato === 'flaky');
          const passate = prove.filter((p) => p.stato === 'expected');
          const hannoGuardato = prove.length - saltate.length;

          const righe = [];
          righe.push('### Prove nel browser (senza chiavi)');
          righe.push('');
          righe.push(`- **${passate.length} passate** su ${prove.length} scritte`);
          righe.push(`- **${rosse.length} rosse**`);
          if (ballerine.length > 0) righe.push(`- **${ballerine.length} ballerine** (verdi solo al secondo tentativo)`);
          righe.push(`- **${saltate.length} saltate**, e qui sotto c'è il perché di ognuna:`);
          righe.push('');
          for (const p of saltate) {
            righe.push(`  - \`${p.nome}\` — ${p.motivo || 'saltata senza motivo dichiarato'}`);
          }
          righe.push('');
          righe.push(
            hannoGuardato > 0
              ? `${hannoGuardato} prove hanno davvero aperto una pagina o interrogato il server. Nessun segreto è stato usato.`
              : 'NESSUNA prova ha guardato niente.',
          );
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, righe.join('\n') + '\n');
          }
          console.log(righe.join('\n'));

          // ① Una suite che si salta per intero non può uscire con la stessa
          //    spunta di una che ha provato. È il difetto di partenza, e qui
          //    diventa rosso invece che verde.
          if (hannoGuardato === 0) {
            console.log('::error::le prove nel browser si sono saltate tutte: nessuna pagina è stata aperta, e un verde qui sarebbe una bugia');
            process.exit(1);
          }
          // ② Una prova saltata senza motivo scritto è un interruttore
          //    travestito: chi la salta deve dire perché.
          const mute = saltate.filter((p) => !p.motivo);
          if (mute.length > 0) {
            for (const p of mute) console.log(`::error::«${p.nome}» è saltata senza dire perché`);
            process.exit(1);
          }
          process.exit(Number(statoDetto) === 0 ? 0 : 1);
          FINE_SCRIPT
          node /tmp/riassumi-prove-browser.mjs esito-prove-browser.json "$STATUS"

  # 31/8/2026 (R102) — L'ACCESSIBILITA' HA UN LAVORO SUO, E NON PUO' SPEGNERSI.
  #
  # axe viveva dentro il lavoro qui sopra, dove ogni passo e' appeso a
  # `steps.e2e.outputs.enabled == 'true'`. Quel valore diventa `false` quando
  # mancano i segreti di un Supabase di prova, che non ci sono mai stati:
  # nell'esecuzione 33053827261 su `main` il lavoro risultava SUCCESS con
  # «Install Playwright», «Build» e «Start app + run e2e» tutti SKIPPED. La
  # Dichiarazione di Accessibilita' promette la conformita' all'European
  # Accessibility Act, e l'unica prova che poteva smentirla non ha mai aperto un
  # browser.
  #
  # Qui l'accessibilita' e' staccata dagli smoke: quelli hanno bisogno di dati
  # veri per avere senso, axe no. Nomi, ruoli, contrasto, landmark e ordine dei
  # titoli si controllano identici su un sito vuoto, e le variabili sono finte
  # apposta. NESSUN PASSO DI QUESTO LAVORO HA UN `if:` E NESSUNO LEGGE UN
  # SEGRETO: e' quello che lo tiene acceso, e la prova
  # tests/unit/il-cancello-dell-accessibilita-gira-sempre.test.ts diventa rossa
  # se qualcuno ne aggiunge uno.
  a11y:
    name: Accessibilita (axe) — non si spegne mai
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Installa Chromium per Playwright
        run: npx playwright install --with-deps chromium

      # Variabili finte, scritte in chiaro qui dentro: non sono un segreto
      # dimenticato, sono la scelta. Il giorno che qualcuno rimuovesse un
      # segreto dalle impostazioni del repository, questo lavoro continuerebbe a
      # girare identico.
      - name: Build con variabili finte
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://accessibilita-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-il-cancello-accessibilita"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
        run: npm run build

      - name: Apri ogni pagina con axe
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://accessibilita-senza-database.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "chiave-finta-per-il-cancello-accessibilita"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
          E2E_BASE_URL: "http://localhost:3000"
        run: |
          # `npm start` lancia un figlio (il server Next): chiudendo solo npm il
          # server resta vivo e il lavoro finisce in timeout. Si chiude il gruppo.
          set -m
          npm start &
          APP_PID=$!
          su=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000 >/dev/null 2>&1; then su="si"; break; fi
            sleep 1
          done
          if [ -z "$su" ]; then
            echo "::error::l'app non ha risposto entro 60 secondi: axe non ha potuto guardare niente"
            kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          set +e
          npm run test:e2e -- tests/e2e/11-a11y-percorso-acquisto.spec.ts --project=chromium
          STATUS=$?
          kill -- -"$APP_PID" 2>/dev/null || kill "$APP_PID" 2>/dev/null || true
          exit $STATUS

      # Il difetto era «un verde che non prova niente». L'antidoto e' dire, dove
      # si guarda, che stavolta ha provato — e su quante pagine.
      - name: Dichiara che l'accessibilita e' stata provata
        run: |
          pagine=$(grep -cE "^  \{ nome:" tests/e2e/11-a11y-percorso-acquisto.spec.ts || true)
          {
            echo "✅ **Accessibilita (axe)**: girata su $pagine pagine, senza nessun segreto e senza nessuna condizione."
          } >> "$GITHUB_STEP_SUMMARY"
