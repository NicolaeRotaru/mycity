name: Backup database

# Perché questo file esiste: lo script scripts/backup-db.sh era scritto bene e
# non lo eseguiva nessuno. Nessun blocco periodico nella configurazione di
# rilascio, nessun lavoro
# in CI, nessuna voce nell'elenco dei cron: zero backup. E l'unica copia
# possibile finiva sul disco del contenitore, che si azzera a ogni rilascio.
#
# Qui il backup gira ogni notte e il file viene conservato fuori dal contenitore,
# fra gli artefatti dell'esecuzione, per 30 giorni.
#
# Serve il segreto SUPABASE_DB_URL (la stringa di connessione al database).
# Senza, il lavoro NON finge di essere andato bene: si fermerà con un messaggio
# esplicito, perché un backup che non c'è va visto subito, non alla prima
# emergenza.

on:
  schedule:
    - cron: "17 2 * * *" # ogni notte alle 02:17 UTC
    - cron: "41 3 1 * *" # il primo del mese: la prova di ripristino
  workflow_dispatch: {} # avviabile anche a mano


# 27/8/2026 (R188) — Il primo del mese le due cadenze cadono vicine, e chi lo
# avvia a mano puo' sovrapporsi a entrambe. Due esecuzioni insieme vogliono dire
# due copie che si scrivono addosso e, il primo del mese, due prove di ripristino
# sullo stesso database di appoggio. Si aspetta, non si annulla: un ripristino
# interrotto lascia un database a meta'.
concurrency:
  group: backup-database
  cancel-in-progress: false


# #244 — Il minimo indispensabile. Senza questo blocco ogni lavoro parte col
# permesso predefinito del repository, che di norma è di SCRITTURA: uno script
# di una dipendenza compromessa potrebbe scrivere sul codice o creare rilasci.
# Qui serve solo leggere.
permissions:
  contents: read

jobs:
  backup:
    name: Copia notturna
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 22/8/2026 — IL CLIENT DELLA COPIA NON ERA AGGANCIATO AL SERVER, E LA
      # COPIA NOTTURNA ERA GIA' ROTTA.
      #
      # `pg_dump` si rifiuta di lavorare quando il server e' piu' recente di
      # lui. Qui si installava «qualunque versione ci sia nei pacchetti del
      # computer di turno»: su Ubuntu 24.04 e' la 16.
      #
      # Il database di produzione, controllato oggi, gira la 17. Quindi non e'
      # un rischio futuro: e' un guasto presente. La copia notturna dei dati
      # falliva gia', e falliva di notte, dove non guarda nessuno.
      #
      # Adesso la versione e' scritta qui sotto e si installa esattamente
      # quella, dal deposito ufficiale di PostgreSQL. Quando Supabase
      # aggiornera' ancora, questo lavoro diventera' rosso con un messaggio che
      # si capisce, invece che con un errore di versione in fondo a un log.
      - name: Installa il client Postgres
        env:
          # La versione del database di produzione (controllata il 22/8/2026).
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          pg_dump --version
          pg_dump --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::pg_dump non e' la versione ${VERSIONE_ATTESA}: la copia userebbe un client sbagliato."
            exit 1
          }

      - name: Verifica di sapere dove copiare
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Manca il segreto SUPABASE_DB_URL: nessun backup eseguito. Aggiungilo in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # #234 — Il file contiene nomi, indirizzi, telefoni e ordini di tutti.
          # Senza passphrase resterebbe in chiaro per trenta giorni fra gli
          # artefatti, scaricabile da chiunque abbia accesso al repository.
          # Meglio un backup che manca e si vede, che un backup che espone
          # tutti e non lo dice.
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Manca il segreto BACKUP_PASSPHRASE: il backup NON viene eseguito perché uscirebbe in chiaro. Scegli una passphrase lunga, salvala dove tieni le password e aggiungila in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Esegui il backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ github.workspace }}/backup
        run: |
          mkdir -p "$BACKUP_DIR"
          bash scripts/backup-db.sh

      - name: Conserva la copia fuori dal contenitore
        uses: actions/upload-artifact@v4
        with:
          name: backup-database-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

  prova-di-ripristino:
    name: La copia si riapre davvero (mensile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gira il primo del mese, e a mano quando serve. Non ogni notte: e' una
    # verifica, non una copia.
    if: github.event.schedule == '41 3 1 * *' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # 22/8/2026 — UNA COPIA MAI RIPROVATA NON E' UNA COPIA.
      #
      # La copia notturna gira dal 20 agosto e nessuno l'ha mai riaperta. Il
      # runbook dichiarava «~30 minuti dal guasto al ripristino»: un numero
      # scritto a tavolino, mai cronometrato. Non sapevamo nemmeno se quel file
      # si riapre.
      #
      # Qui la prova gira da sola, una volta al mese, su un Postgres vuoto che
      # vive quanto il lavoro: se il ripristino non riesce, questo lavoro
      # diventa rosso e lo si scopre in un giorno qualunque invece che in
      # emergenza. Non serve nessuna chiave in piu' di quelle che la copia usa
      # gia'.
      - name: Checkout
        uses: actions/checkout@v4

      # 22/8/2026 — IL CLIENT DELLA COPIA NON ERA AGGANCIATO AL SERVER, E LA
      # COPIA NOTTURNA ERA GIA' ROTTA.
      #
      # `pg_dump` si rifiuta di lavorare quando il server e' piu' recente di
      # lui. Qui si installava «qualunque versione ci sia nei pacchetti del
      # computer di turno»: su Ubuntu 24.04 e' la 16.
      #
      # Il database di produzione, controllato oggi, gira la 17. Quindi non e'
      # un rischio futuro: e' un guasto presente. La copia notturna dei dati
      # falliva gia', e falliva di notte, dove non guarda nessuno.
      #
      # Adesso la versione e' scritta qui sotto e si installa esattamente
      # quella, dal deposito ufficiale di PostgreSQL. Quando Supabase
      # aggiornera' ancora, questo lavoro diventera' rosso con un messaggio che
      # si capisce, invece che con un errore di versione in fondo a un log.
      - name: Installa il client Postgres
        env:
          # La versione del database di produzione (controllata il 22/8/2026).
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          pg_dump --version
          pg_dump --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::pg_dump non e' la versione ${VERSIONE_ATTESA}: la copia userebbe un client sbagliato."
            exit 1
          }

      - name: Verifica di avere i segreti
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Senza SUPABASE_DB_URL e BACKUP_PASSPHRASE la prova di ripristino non si puo' fare."
            exit 1
          fi

      - name: Fai una copia fresca
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ github.workspace }}/backup
        run: |
          mkdir -p "$BACKUP_DIR"
          bash scripts/backup-db.sh

      - name: Riaprila su un database vuoto, e cronometra
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          file="$(ls -t "${{ github.workspace }}"/backup/*.gpg | head -1)"
          echo "▶ ripristino da $(basename "$file")"
          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" \
            --output /tmp/copia.dump "$file"

          psql -q -d postgres -c "CREATE DATABASE prova_ripristino;"
          inizio=$(date +%s)
          # I ruoli e gli schemi di sistema del fornitore qui non esistono: gli
          # errori su quelli non sono il fallimento che stiamo cercando.
          pg_restore --no-owner --no-acl --dbname=prova_ripristino /tmp/copia.dump || true
          fine=$(date +%s)
          echo "⏱  ripristino in $((fine - inizio)) secondi"

          # La prova vera: le tabelle che contano ci sono e si leggono.
          for tabella in profiles products orders order_items; do
            n=$(psql -tA -d prova_ripristino -c "SELECT count(*) FROM public.$tabella;")
            echo "   $tabella: $n righe"
          done

          echo "### Prova di ripristino" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La copia si riapre: **sì**, in **$((fine - inizio)) secondi**." >> "$GITHUB_STEP_SUMMARY"
