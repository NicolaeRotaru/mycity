name: Backup database

# Perché questo file esiste: lo script scripts/backup-db.sh era scritto bene e
# non lo eseguiva nessuno. Nessun blocco periodico nella configurazione di
# rilascio, nessun lavoro
# in CI, nessuna voce nell'elenco dei cron: zero backup. E l'unica copia
# possibile finiva sul disco del contenitore, che si azzera a ogni rilascio.
#
# Qui il backup gira ogni notte e il file viene conservato fuori dal contenitore,
# fra gli artefatti dell'esecuzione, per 30 giorni.
#
# Serve il segreto SUPABASE_DB_URL (la stringa di connessione al database).
# Senza, il lavoro NON finge di essere andato bene: si fermerà con un messaggio
# esplicito, perché un backup che non c'è va visto subito, non alla prima
# emergenza.

on:
  schedule:
    - cron: "17 2 * * *" # ogni notte alle 02:17 UTC
    - cron: "41 3 1 * *" # il primo del mese: la prova di ripristino
  workflow_dispatch: {} # avviabile anche a mano


# 27/8/2026 (R188) — Il primo del mese le due cadenze cadono vicine, e chi lo
# avvia a mano puo' sovrapporsi a entrambe. Due esecuzioni insieme vogliono dire
# due copie che si scrivono addosso e, il primo del mese, due prove di ripristino
# sullo stesso database di appoggio. Si aspetta, non si annulla: un ripristino
# interrotto lascia un database a meta'.
concurrency:
  group: backup-database
  cancel-in-progress: false


# #244 — Il minimo indispensabile. Senza questo blocco ogni lavoro parte col
# permesso predefinito del repository, che di norma è di SCRITTURA: uno script
# di una dipendenza compromessa potrebbe scrivere sul codice o creare rilasci.
# Qui serve solo leggere.
permissions:
  contents: read

jobs:
  backup:
    name: Copia notturna
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 22/8/2026 — IL CLIENT DELLA COPIA NON ERA AGGANCIATO AL SERVER, E LA
      # COPIA NOTTURNA ERA GIA' ROTTA.
      #
      # `pg_dump` si rifiuta di lavorare quando il server e' piu' recente di
      # lui. Qui si installava «qualunque versione ci sia nei pacchetti del
      # computer di turno»: su Ubuntu 24.04 e' la 16.
      #
      # Il database di produzione, controllato oggi, gira la 17. Quindi non e'
      # un rischio futuro: e' un guasto presente. La copia notturna dei dati
      # falliva gia', e falliva di notte, dove non guarda nessuno.
      #
      # Adesso la versione e' scritta qui sotto e si installa esattamente
      # quella, dal deposito ufficiale di PostgreSQL. Quando Supabase
      # aggiornera' ancora, questo lavoro diventera' rosso con un messaggio che
      # si capisce, invece che con un errore di versione in fondo a un log.
      - name: Installa il client Postgres
        env:
          # La versione del database di produzione (controllata il 22/8/2026).
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          # 7/9/2026 — INSTALLARE NON BASTA, E QUESTA COPIA NON E' MAI RIUSCITA.
          #
          # Ventuno corse dal 19 agosto, ventuno fallite, sempre sulla riga qui sotto:
          # «pg_dump non e' la versione 17». Il pacchetto si installava benissimo. Il punto
          # e' che il computer di turno porta gia' PostgreSQL 16, e la cartella dei suoi
          # binari viene PRIMA di /usr/bin nel percorso di ricerca. Quindi `pg_dump`
          # chiamato per nome restava la 16, per quanti pacchetti si installassero.
          #
          # Le due righe qui sotto mettono davanti la cartella della versione giusta:
          # `export` per il controllo di questo stesso passo, $GITHUB_PATH per i passi dopo,
          # che sono processi nuovi e altrimenti ritroverebbero la 16.
          echo "/usr/lib/postgresql/${VERSIONE_ATTESA}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${VERSIONE_ATTESA}/bin:$PATH"
          pg_dump --version
          pg_dump --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::pg_dump non e' la versione ${VERSIONE_ATTESA}: la copia userebbe un client sbagliato."
            exit 1
          }

      - name: Verifica di sapere dove copiare
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Manca il segreto SUPABASE_DB_URL: nessun backup eseguito. Aggiungilo in Settings → Secrets and variables → Actions."
            exit 1
          fi
          # 7/9/2026 — LA PRIMA CORSA CON LE CHIAVI COLLEGATE E' MORTA UN PASSO PIU' IN LA',
          # e il messaggio che usciva non aiutava nessuno:
          #   «connection to server on socket "/var/run/postgresql/.s.PGSQL.5432" failed»
          # Sembra un database locale rotto. E' il contrario: quando pg_dump non riconosce un
          # indirizzo, prende l'ultimo argomento come NOME del database e va a cercare un server
          # sulla macchina di turno — dove non c'e' nessun database. Cioe' quel messaggio dice
          # «il valore che mi hai dato non e' un indirizzo», ma lo dice in un modo che manda a
          # cercare il guasto dalla parte sbagliata.
          #
          # Qui si guarda solo la FORMA, mai il valore: il segreto non finisce nel registro.
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL non è un indirizzo di collegamento: deve cominciare con postgresql:// (oppure postgres://). Su Supabase lo trovi nel pannello Connect, riquadro «Session pooler»: va incollata la riga intera, senza «psql» davanti, senza virgolette, senza spazi né a capo prima o dopo."
              exit 1
              ;;
          esac

          # 8/9/2026 — IL MURO DOPO QUELLO SOPRA, e la prima volta ci ho mandato dentro io.
          #
          # Passata la forma, la copia e' morta cosi':
          #   pg_dump: error: connection to server at "db.<progetto>.supabase.co"
          #   (2a05:d012:...), port 5432 failed: Network is unreachable
          #
          # L'indirizzo era giusto. Il punto e' che la CONNESSIONE DIRETTA di Supabase
          # (`db.<progetto>.supabase.co`) risponde solo in IPv6, e i computer di GitHub Actions
          # hanno solo IPv4: la rete non ci arriva proprio. Non e' un errore di credenziali e non
          # e' il database spento, ed e' per questo che il messaggio manda fuori strada.
          #
          # La strada giusta da qui e' il «Session pooler» di Supabase, che risponde in IPv4 e
          # regge pg_dump (il «Transaction pooler», porta 6543, no: non tiene le sessioni che
          # servono a una copia).
          #
          # Si guarda solo il nome della macchina, mai il resto del valore.
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL punta alla connessione diretta di Supabase (db.<progetto>.supabase.co), che risponde solo in IPv6: da GitHub Actions, che ha solo IPv4, non ci si arriva. Serve la riga del «Session pooler» — pannello Connect di Supabase, riquadro Session pooler, porta 5432 (NON il Transaction pooler sulla 6543, che non regge la copia)."
              exit 1
              ;;
          esac
          # #234 — Il file contiene nomi, indirizzi, telefoni e ordini di tutti.
          # Senza passphrase resterebbe in chiaro per trenta giorni fra gli
          # artefatti, scaricabile da chiunque abbia accesso al repository.
          # Meglio un backup che manca e si vede, che un backup che espone
          # tutti e non lo dice.
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Manca il segreto BACKUP_PASSPHRASE: il backup NON viene eseguito perché uscirebbe in chiaro. Scegli una passphrase lunga, salvala dove tieni le password e aggiungila in Settings → Secrets and variables → Actions."
            exit 1
          fi

      # 8/9/2026 — IL FILO CHE MANCAVA, E CHE AVREBBE FATTO CREDERE A NICOLA DI
      # AVERE UNA COPIA DELLE FOTO CHE NON C'ERA.
      #
      # Il pezzo che copia le immagini e' scritto in fondo a scripts/backup-db.sh
      # dal 31 agosto, e si accende «da solo appena ci sono le variabili». Solo
      # che le variabili nessuno gliele passava: questo lavoro gli dava tre cose
      # (indirizzo del database, passphrase, cartella) e basta. Quindi il giorno
      # in cui Nicola avesse comprato il secchio e messo le chiavi nei segreti,
      # la copia delle foto NON sarebbe partita lo stesso — e lui avrebbe visto
      # una spunta verde e concluso che le foto erano al sicuro.
      #
      # E' il difetto peggiore dei tre: non «manca una copia» (lo sai), ma
      # «credi di averla» (non lo sai). Qui il filo si attacca.
      #
      # Servono tre cose insieme, e o ci sono tutte o non c'e' niente:
      #   vars.STORAGE_SYNC_SOURCE     il remote rclone del fornitore  ("supabase:")
      #   vars.STORAGE_SYNC_DEST       il remote di destinazione       ("b2:mycity-foto")
      #   secrets.RCLONE_CONFIG_BASE64 la configurazione di rclone con le chiavi
      # Mezza configurazione e' la trappola: sembra accesa e non copia niente.
      # Per questo qui diventa rossa invece di restare verde in silenzio.
      - name: Le foto vanno in copia?
        id: foto
        env:
          SORGENTE: ${{ vars.STORAGE_SYNC_SOURCE }}
          DESTINAZIONE: ${{ vars.STORAGE_SYNC_DEST }}
          CONFIGURAZIONE: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mancanti=""
          presenti=0
          if [ -n "${SORGENTE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti STORAGE_SYNC_SOURCE(variabile)"; fi
          if [ -n "${DESTINAZIONE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti STORAGE_SYNC_DEST(variabile)"; fi
          if [ -n "${CONFIGURAZIONE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti RCLONE_CONFIG_BASE64(segreto)"; fi

          if [ "$presenti" -eq 0 ]; then
            echo "accesa=no" >> "$GITHUB_OUTPUT"
            echo "::warning::La copia delle foto e' spenta: mancano il secchio di destinazione e le sue chiavi. Il database viene copiato lo stesso."
            exit 0
          fi
          if [ "$presenti" -lt 3 ]; then
            echo "::error::La copia delle foto e' configurata a meta': manca$mancanti. Cosi' non copierebbe niente e il lavoro sarebbe verde lo stesso. Mettile tutte e tre, oppure toglile tutte."
            exit 1
          fi
          echo "accesa=si" >> "$GITHUB_OUTPUT"
          echo "La copia delle foto e' accesa."

      - name: Prepara rclone
        if: steps.foto.outputs.accesa == 'si'
        env:
          CONFIGURAZIONE: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone
          # La configurazione contiene le chiavi del secchio: si scrive su un
          # file leggibile solo dall'utente e non si stampa mai.
          install -d -m 700 "$HOME/.config/rclone"
          printf '%s' "$CONFIGURAZIONE" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          # `listremotes` stampa solo i NOMI dei remote, mai le chiavi: serve a
          # vedere subito se la configurazione si e' letta.
          rclone listremotes

      - name: Esegui il backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ github.workspace }}/backup
          STORAGE_SYNC_SOURCE: ${{ vars.STORAGE_SYNC_SOURCE }}
          STORAGE_SYNC_DEST: ${{ vars.STORAGE_SYNC_DEST }}
          STORAGE_SYNC_BUCKETS: ${{ vars.STORAGE_SYNC_BUCKETS }}
          STORAGE_SYNC_STORICO: ${{ vars.STORAGE_SYNC_STORICO }}
        run: |
          mkdir -p "$BACKUP_DIR"
          bash scripts/backup-db.sh

      # 8/9/2026 — LA COPIA DEL DATABASE NON DEVE MORIRE INSIEME ALLE FOTO.
      #
      # Di norma un passo fallito salta tutti quelli dopo. Quindi la notte in cui
      # la copia delle foto fallisce — e da oggi puo' fallire per motivi nuovi,
      # per esempio una chiave che non sa rileggere — il dump del database
      # veniva scritto e cifrato dentro il contenitore, e poi buttato via con il
      # contenitore stesso: nessun artefatto, nessuna copia di quella notte.
      #
      # Si sarebbe perso il pezzo piu' importante per colpa del meno importante.
      # `!cancelled()` conserva la copia comunque: il lavoro resta rosso (giusto,
      # va visto), ma il database di stanotte c'e'.
      - name: Conserva la copia fuori dal contenitore
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-database-${{ github.run_id }}
          path: backup/
          retention-days: 30
          if-no-files-found: error

  prova-di-ripristino:
    name: La copia si riapre davvero (mensile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gira il primo del mese, e a mano quando serve. Non ogni notte: e' una
    # verifica, non una copia.
    if: github.event.schedule == '41 3 1 * *' || github.event_name == 'workflow_dispatch'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # 22/8/2026 — UNA COPIA MAI RIPROVATA NON E' UNA COPIA.
      #
      # La copia notturna gira dal 20 agosto e nessuno l'ha mai riaperta. Il
      # runbook dichiarava «~30 minuti dal guasto al ripristino»: un numero
      # scritto a tavolino, mai cronometrato. Non sapevamo nemmeno se quel file
      # si riapre.
      #
      # Qui la prova gira da sola, una volta al mese, su un Postgres vuoto che
      # vive quanto il lavoro: se il ripristino non riesce, questo lavoro
      # diventa rosso e lo si scopre in un giorno qualunque invece che in
      # emergenza. Non serve nessuna chiave in piu' di quelle che la copia usa
      # gia'.
      - name: Checkout
        uses: actions/checkout@v4

      # 22/8/2026 — IL CLIENT DELLA COPIA NON ERA AGGANCIATO AL SERVER, E LA
      # COPIA NOTTURNA ERA GIA' ROTTA.
      #
      # `pg_dump` si rifiuta di lavorare quando il server e' piu' recente di
      # lui. Qui si installava «qualunque versione ci sia nei pacchetti del
      # computer di turno»: su Ubuntu 24.04 e' la 16.
      #
      # Il database di produzione, controllato oggi, gira la 17. Quindi non e'
      # un rischio futuro: e' un guasto presente. La copia notturna dei dati
      # falliva gia', e falliva di notte, dove non guarda nessuno.
      #
      # Adesso la versione e' scritta qui sotto e si installa esattamente
      # quella, dal deposito ufficiale di PostgreSQL. Quando Supabase
      # aggiornera' ancora, questo lavoro diventera' rosso con un messaggio che
      # si capisce, invece che con un errore di versione in fondo a un log.
      - name: Installa il client Postgres
        env:
          # La versione del database di produzione (controllata il 22/8/2026).
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          # 7/9/2026 — INSTALLARE NON BASTA, E QUESTA COPIA NON E' MAI RIUSCITA.
          #
          # Ventuno corse dal 19 agosto, ventuno fallite, sempre sulla riga qui sotto:
          # «pg_dump non e' la versione 17». Il pacchetto si installava benissimo. Il punto
          # e' che il computer di turno porta gia' PostgreSQL 16, e la cartella dei suoi
          # binari viene PRIMA di /usr/bin nel percorso di ricerca. Quindi `pg_dump`
          # chiamato per nome restava la 16, per quanti pacchetti si installassero.
          #
          # Le due righe qui sotto mettono davanti la cartella della versione giusta:
          # `export` per il controllo di questo stesso passo, $GITHUB_PATH per i passi dopo,
          # che sono processi nuovi e altrimenti ritroverebbero la 16.
          echo "/usr/lib/postgresql/${VERSIONE_ATTESA}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${VERSIONE_ATTESA}/bin:$PATH"
          pg_dump --version
          pg_dump --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::pg_dump non e' la versione ${VERSIONE_ATTESA}: la copia userebbe un client sbagliato."
            exit 1
          }

      - name: Verifica di avere i segreti
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB" ] || [ -z "$PASS" ]; then
            echo "::error::Senza SUPABASE_DB_URL e BACKUP_PASSPHRASE la prova di ripristino non si puo' fare."
            exit 1
          fi

      # 8/9/2026 — La prova mensile deve provare anche le FOTO, non solo le
      # tabelle. La scheda che ha chiesto questa copia finiva cosi': «la prova
      # mensile deve verificare che almeno un file si riapra». Lo script adesso
      # riapre davvero una foto dalla copia prima di dirsi riuscito — ma solo se
      # qui gli si passano le stesse variabili della copia notturna. Senza, la
      # prova mensile proverebbe meta' della rete di sicurezza.
      - name: Le foto vanno provate?
        id: foto
        env:
          SORGENTE: ${{ vars.STORAGE_SYNC_SOURCE }}
          DESTINAZIONE: ${{ vars.STORAGE_SYNC_DEST }}
          CONFIGURAZIONE: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          mancanti=""
          presenti=0
          if [ -n "${SORGENTE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti STORAGE_SYNC_SOURCE(variabile)"; fi
          if [ -n "${DESTINAZIONE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti STORAGE_SYNC_DEST(variabile)"; fi
          if [ -n "${CONFIGURAZIONE:-}" ]; then presenti=$((presenti + 1)); else mancanti="$mancanti RCLONE_CONFIG_BASE64(segreto)"; fi

          if [ "$presenti" -eq 0 ]; then
            echo "accesa=no" >> "$GITHUB_OUTPUT"
            echo "::warning::La prova mensile non prova le foto: la loro copia e' spenta."
            exit 0
          fi
          if [ "$presenti" -lt 3 ]; then
            echo "::error::La copia delle foto e' configurata a meta': manca$mancanti. Cosi' non copierebbe niente e il lavoro sarebbe verde lo stesso. Mettile tutte e tre, oppure toglile tutte."
            exit 1
          fi
          echo "accesa=si" >> "$GITHUB_OUTPUT"
          echo "La copia delle foto e' accesa: la prova la comprende."

      - name: Prepara rclone
        if: steps.foto.outputs.accesa == 'si'
        env:
          CONFIGURAZIONE: ${{ secrets.RCLONE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone
          install -d -m 700 "$HOME/.config/rclone"
          printf '%s' "$CONFIGURAZIONE" | base64 -d > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone listremotes

      - name: Fai una copia fresca
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ github.workspace }}/backup
          STORAGE_SYNC_SOURCE: ${{ vars.STORAGE_SYNC_SOURCE }}
          STORAGE_SYNC_DEST: ${{ vars.STORAGE_SYNC_DEST }}
          STORAGE_SYNC_BUCKETS: ${{ vars.STORAGE_SYNC_BUCKETS }}
          STORAGE_SYNC_STORICO: ${{ vars.STORAGE_SYNC_STORICO }}
        run: |
          mkdir -p "$BACKUP_DIR"
          bash scripts/backup-db.sh

      - name: Riaprila su un database vuoto, e cronometra
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail

          # 27/8/2026 (R179) — QUI SI RIAPRIVA IL FILE SBAGLIATO.
          #
          # Il backup notturno scrive DUE file nello stesso secondo: il database
          # (`mycity_<data>.dump.gpg`) e la sola tabella degli utenti
          # (`..._utenti.dump.gpg`). La scelta era `ls -t | head -1`, cioe' «il
          # piu' recente» — e fra due file nati a meno di un secondo di distanza
          # quale sia il piu' recente non lo decide nessuno. La prova che deve
          # dirci «la copia si riapre» poteva riaprire trecento righe di utenti e
          # dichiararsi soddisfatta senza aver mai toccato il database.
          #
          # Adesso la scelta si fa per nome, con scripts/copie-di-backup.mjs, che
          # ha le sue prove in
          # tests/unit/la-prova-di-ripristino-riapre-il-database-vero.test.ts.
          cartella="${{ github.workspace }}/backup"
          principale="$(ls "$cartella" | node scripts/copie-di-backup.mjs principale)"
          utenti="$(ls "$cartella" | node scripts/copie-di-backup.mjs utenti)"
          echo "▶ ripristino da $principale (utenti: $utenti)"

          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" \
            --output /tmp/copia.dump "$cartella/$principale"
          gpg --batch --yes --decrypt --passphrase "$BACKUP_PASSPHRASE" \
            --output /tmp/copia_utenti.dump "$cartella/$utenti"

          psql -q -d postgres -c "CREATE DATABASE prova_ripristino;"
          inizio=$(date +%s)
          # I ruoli e gli schemi di sistema del fornitore qui non esistono: gli
          # errori su quelli non sono il fallimento che stiamo cercando. Il `||
          # true` resta solo su questa riga, e non copre piu' niente: le
          # asserzioni qui sotto sono la vera sentenza.
          pg_restore --no-owner --no-acl --dbname=prova_ripristino /tmp/copia.dump || true
          # #234 — Gli utenti stanno in un dump a parte: senza, il database
          # ripristinato non ha nessuno a cui appartengano gli ordini.
          psql -q -d prova_ripristino -c "CREATE SCHEMA IF NOT EXISTS auth;"
          pg_restore --no-owner --no-acl --dbname=prova_ripristino /tmp/copia_utenti.dump || true
          fine=$(date +%s)
          echo "⏱  ripristino in $((fine - inizio)) secondi"

          # LA PROVA VERA. Prima qui si contava e si stampava, e basta: un
          # conteggio a zero passava identico a uno pieno. Un ripristino che
          # restituisce quattro tabelle vuote non e' un ripristino riuscito, e
          # una copia di sicurezza che nessuno ha mai riaperto davvero non e'
          # una copia di sicurezza: e' una speranza.
          vuote=""
          for tabella in profiles products orders order_items; do
            n=$(psql -tA -d prova_ripristino -c "SELECT count(*) FROM public.$tabella;")
            echo "   $tabella: $n righe"
            if [ "$n" -eq 0 ]; then vuote="$vuote $tabella"; fi
          done
          # `profiles` e `products` non possono essere vuote su un marketplace
          # vivo: se lo sono, la copia non contiene quello che credevamo.
          for attesa in profiles products; do
            n=$(psql -tA -d prova_ripristino -c "SELECT count(*) FROM public.$attesa;")
            if [ "$n" -eq 0 ]; then
              echo "::error::La copia si e' riaperta ma $attesa e' vuota: questo backup non salverebbe niente."
              exit 1
            fi
          done
          # Gli utenti: la ragione per cui esiste il secondo file.
          nu=$(psql -tA -d prova_ripristino -c "SELECT count(*) FROM auth.users;")
          echo "   auth.users: $nu righe"
          if [ "$nu" -eq 0 ]; then
            echo "::error::Nessun utente ripristinato: gli ordini tornerebbero senza proprietario."
            exit 1
          fi
          if [ -n "$vuote" ]; then echo "::warning::Tabelle vuote dopo il ripristino:$vuote"; fi

          echo "### Prova di ripristino" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La copia si riapre: **sì**, in **$((fine - inizio)) secondi**." >> "$GITHUB_STEP_SUMMARY"
