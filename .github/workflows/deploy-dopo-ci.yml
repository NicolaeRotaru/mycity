name: Rilascio dopo CI verde

# A COSA SERVE. Il rilascio del sito partiva da solo a ogni unione su `main`,
# senza aspettare i controlli. I due correvano in parallelo, quindi un controllo
# rosso finiva in produzione lo stesso: la CI diventava un referto che arriva
# dopo il funerale.
#
# Questo lavoro rilascia SOLO quando i controlli di `main` sono passati, e
# rilascia il commit che i controlli hanno promosso — non la punta di adesso,
# perche' fra la fine dei controlli e questo passo qualcuno puo' aver spinto
# altro, e quello non l'ha provato nessuno.
#
# IL SITO VIVE SU VERCEL. Fino al 21/8/2026 questo file parlava anche di Render,
# e la carta #141 mandava Nicola a spegnere il rilascio automatico li'. Era il
# bersaglio sbagliato: guardando i rilasci veri, ogni unione su `main` faceva
# partire una pubblicazione di PRODUZIONE su Vercel entro pochi secondi. Nicola
# ha poi confermato di non usare piu' Render, e il pezzo e' stato tolto: una
# strada morta lasciata nel file e' una trappola per chi legge di fretta.
#
# ⚠️ PERCHE' QUESTO NON E' ANCORA L'UNICA STRADA. Servono due cose, in QUESTO
# ordine — al contrario il sito smette di aggiornarsi e basta:
#
#   1. i segreti, su GitHub → Settings → Secrets and variables → Actions:
#      · VERCEL_TOKEN       (Vercel → Account Settings → Tokens → Create)
#      · VERCEL_ORG_ID      e  VERCEL_PROJECT_ID
#        (Vercel → il progetto → Settings → General, in fondo)
#
#   2. SOLO DOPO, una parola in `vercel.json`:
#      "main": true   diventa   "main": false
#
# Finche' i segreti mancano, questo lavoro non rilascia niente e non blocca
# nessuna unione — ma dal 31/8/2026 finisce ROSSO invece che verde, perche' un
# lavoro che non ha guardato niente non puo' mostrare la stessa spunta di uno
# che e' andato a bussare al sito. Il verde di prima era una risposta a una
# domanda che nessuno aveva fatto: ventidue esecuzioni su ventidue verdi, e la
# prova di fumo non era mai partita nemmeno una volta.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}


# 27/8/2026 (R188) — DUE RILASCI POTEVANO APPLICARE MIGRAZIONI INSIEME.
#
# Due unioni ravvicinate su `main` facevano partire due esecuzioni di questo
# lavoro in parallelo, e tutte e due arrivavano ad applicare migrazioni sullo
# STESSO database di produzione. Due `psql` che scrivono lo schema nello stesso
# momento e' il modo piu' diretto per ritrovarsi con un database a meta'.
#
# `cancel-in-progress: false` e' voluto e va lasciato cosi': un rilascio fermato
# a meta' migrazioni non «si annulla», lascia il database in uno stato che
# nessuno ha previsto. Il secondo aspetta il suo turno.
concurrency:
  group: rilascio-produzione
  cancel-in-progress: false


# #244 — Il minimo indispensabile. Senza questo blocco ogni lavoro parte col
# permesso predefinito del repository, che di norma è di SCRITTURA: uno script
# di una dipendenza compromessa potrebbe scrivere sul codice o creare rilasci.
# Qui serve solo leggere.
permissions:
  contents: read

jobs:
  vercel:
    name: Chiama Vercel (e' qui che vive il sito)
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 15
    steps:
      - name: Verifica di avere le chiavi
        id: chiavi
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROGETTO: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ORG" ] || [ -z "$PROGETTO" ]; then
            # 28/8/2026 — L'AVVISO STAVA DOVE NON GUARDA NESSUNO.
            #
            # Radiografia del 27/8, quarto bloccante: questo lavoro si dichiara
            # «non pronto», salta tutti i passi e resta VERDE. Fuori si vede una
            # spunta identica a quella di un rilascio controllato, mentre in
            # realta' Vercel sta pubblicando da solo a ogni unione, senza
            # aspettare la CI. Adesso sta scritto in cima al riepilogo, che e'
            # la prima cosa che si vede aprendo il lavoro.
            echo "::warning::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID non configurati: nessun rilascio da qui. Oggi Vercel pubblica da solo a ogni unione su main, SENZA aspettare la CI."
            {
              echo "## ⚠️ Il cancello del rilascio e' SPENTO"
              echo ""
              echo "Mancano \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\` o \`VERCEL_PROJECT_ID\` fra i segreti del repository."
              echo ""
              echo "**Cosa vuol dire adesso:** Vercel pubblica in produzione da solo a ogni unione su \`main\`, in parallelo ai controlli."
              echo "Un difetto che la CI avrebbe intercettato arriva ai clienti prima del referto. Il verde qui sopra non dice che il rilascio e' controllato: dice che questo lavoro non ha fatto niente."
              echo ""
              echo "**Come si accende**, in quest'ordine (al contrario il sito smette di aggiornarsi):"
              echo "1. i tre segreti in Settings → Secrets and variables → Actions;"
              echo "2. una prova di rilascio da qui su un cambio innocuo;"
              echo "3. solo dopo, in vercel.json: la voce deploymentEnabled per main passa da true a false."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      # 1/9/2026 — QUI C'ERA `if: steps.chiavi.outputs.pronto == 'true'`, E
      # ZITTIVA IL VERDETTO.
      #
      # Senza chiavi il checkout saltava, quindi il workspace restava VUOTO. In
      # fondo pero' c'e' un passo `always()` che gira comunque e chiama
      # `node scripts/prova-di-fumo.mjs --verdetto`: senza il repository su
      # disco quel file non esiste, Node muore con MODULE_NOT_FOUND e il
      # verdetto esce vuoto. Nel riepilogo di Nicola non finiva la spiegazione
      # di cosa non era stato controllato — ci finiva una traccia di stack.
      #
      # Cioe': l'unico passo scritto per dire sempre la verita' era anche
      # l'unico che non poteva parlare, proprio nel caso per cui era stato
      # scritto. Visto sul serio nell'esecuzione 33523989477 del 1/9.
      #
      # Il checkout ora gira SEMPRE: costa pochi secondi, non tocca niente
      # fuori dal workspace, e i passi che rilasciano davvero tengono ognuno la
      # propria guardia. Il rosso resta rosso — il verdetto esce 1 in entrambi
      # i casi — ma adesso dice perche'.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Il commit che la CI ha appena promosso, non la punta di adesso: fra
          # la fine della CI e questo passo qualcuno puo' aver spinto altro, e
          # quello non l'ha provato nessuno.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # La stessa versione su cui gira la produzione (progetto Vercel: 24.x,
      # `engines.node` in package.json: 24.x). Qui c'era 20: `vercel build`
      # costruisce con il Node del runner, quindi il pacchetto che finiva online
      # era compilato su una versione diversa da quella che poi lo esegue.
      - name: Setup Node
        if: steps.chiavi.outputs.pronto == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 22/8/2026 — IL CODICE NUOVO ARRIVAVA SU UN DATABASE VECCHIO.
      #
      # Il rilascio pubblicava il codice e basta. Le migrazioni si applicavano a
      # mano, in un momento qualsiasi: fra l'unione e la firma sul database c'e'
      # sempre una finestra — minuti se qualcuno guarda, ore se non guarda
      # nessuno — in cui gira codice che chiede colonne che non esistono. In
      # PostgreSQL una colonna che non c'e' non viene ignorata: fa fallire
      # l'istruzione intera. E' cosi' che il 21 agosto, per un po', non si
      # poteva creare nessun ordine.
      #
      # Adesso le migrazioni si applicano PRIMA della pubblicazione, e se non si
      # applicano il rilascio non parte. Serve il segreto SUPABASE_DB_URL (la
      # stringa di connessione del database di produzione): senza, questo passo
      # si limita a dirlo, come tutti gli altri di questo file.
      - name: Applica le migrazioni al database, prima di pubblicare
        id: migrazioni
        if: steps.chiavi.outputs.pronto == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL non configurato: le migrazioni NON vengono applicate da qui. Il codice puo' arrivare su un database piu' vecchio di lui."
            echo "applicate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "applicate=true" >> "$GITHUB_OUTPUT"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          # 28/8/2026 — QUI C'ERA UN CICLO SU TUTTI I FILE, E NON POTEVA FUNZIONARE.
          #
          # Il commento diceva «le migrazioni del progetto sono idempotenti»: non
          # e' vero. La 001 crea `profiles` e la 002 `categories` senza
          # `IF NOT EXISTS`, quindi su un database che quelle tabelle le ha gia'
          # — cioe' la produzione — psql muore sul PRIMO file. E il ciclo non
          # registrava niente nel registro delle migrazioni, che e' proprio la
          # tabella che il cancello del passo dopo va a leggere.
          #
          # Adesso si applica e si registra solo cio' che manca. Lo stesso
          # script gira due volte di fila nella CI: l'idempotenza si prova.
          bash scripts/applica-migrazioni-mancanti.sh

      # Il cancello: se dopo le migrazioni il database e' ancora diverso da
      # quello che il codice si aspetta, non si pubblica.
      - name: Il database e' allineato al codice
        # `secrets` non si puo' leggere in una condizione di passo: si guarda
        # l'esito del passo qui sopra, che dice se le migrazioni sono girate.
        if: steps.migrazioni.outputs.applicate == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SALTO_E_ERRORE: "1"
        run: npm ci --legacy-peer-deps && npm run db:check-drift

      - name: Rilascia in produzione
        id: rilascio
        if: steps.chiavi.outputs.pronto == 'true'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # 27/8/2026 (R189) — LA VERSIONE ERA «L'ULTIMA CHE C'E' ADESSO».
        #
        # `vercel@latest` vuol dire che lo strumento che pubblica in produzione
        # cambia da solo, senza che nessuno l'abbia deciso ne' provato. Il
        # giorno in cui una versione nuova cambia il comportamento, il rilascio
        # si rompe — o peggio, pubblica qualcosa di diverso — e nel nostro
        # deposito non c'e' nessuna riga modificata che lo spieghi. Bloccata:
        # si aggiorna di proposito, con una richiesta di unione come qualunque
        # altra dipendenza, e tornare indietro e' cambiare un numero.
        run: |
          set -euo pipefail
          VERCEL="vercel@59.10.0"

          # 31/8/2026 (collaudo del rilascio, difetto ①) — A QUALE RILASCIO TORNARE, CHIESTO PRIMA.
          #
          # Dopo la pubblicazione il rilascio in produzione e' gia' quello
          # nuovo: se il ritorno indietro se lo chiedesse dopo, si ritroverebbe
          # a «tornare» su quello rotto. L'unico momento buono e' adesso.
          # L'elenco arriva dall'API, non dallo stdout della CLI: cosi' non
          # dipende da come la CLI decide di stampare le sue righe.
          RILASCI="$(curl -sS --max-time 30 -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=5" || true)"
          PRECEDENTE="$(printf '%s' "$RILASCI" | node scripts/prova-di-fumo.mjs --rilascio-di-adesso || true)"
          if [ -z "$PRECEDENTE" ]; then
            echo "::warning::Non ho trovato il rilascio che sta in produzione adesso: se quello nuovo non risponde, da qui non potro' tornare indietro."
          else
            echo "In produzione adesso c'e': $PRECEDENTE"
          fi
          echo "precedente=$PRECEDENTE" >> "$GITHUB_OUTPUT"

          npx --yes "$VERCEL" pull --yes --environment=production --token="$TOKEN"
          npx --yes "$VERCEL" build --prod --token="$TOKEN"

          # 31/8/2026 (collaudo del rilascio, difetto ②) — QUI C'ERA
          # `tail -n 1`, E PRENDEVA LA RIGA SBAGLIATA.
          #
          # Con la CLI bloccata alla 59.10.0 l'ultima riga dello stdout e'
          # l'avviso «Update available 59.10.0 -> 62.0.1»: non e' l'eccezione,
          # e' lo stato normale di tutti i giorni finche' la versione resta
          # bloccata. Da li' usciva indirizzo='Updateavailable59.10.0->62.0.1',
          # la prova di fumo cadeva su tre controlli su tre e si annullava un
          # rilascio sanissimo. Adesso la riga giusta la sceglie
          # scripts/prova-di-fumo.mjs, che ha le sue prove.
          USCITA_DEL_DEPLOY="$(npx --yes "$VERCEL" deploy --prebuilt --prod --token="$TOKEN")"
          printf '%s\n' "$USCITA_DEL_DEPLOY"
          INDIRIZZO="$(printf '%s' "$USCITA_DEL_DEPLOY" | node scripts/prova-di-fumo.mjs --indirizzo)"
          echo "Pubblicato su: $INDIRIZZO"
          echo "indirizzo=$INDIRIZZO" >> "$GITHUB_OUTPUT"

      # 27/8/2026 (R178) — SI PUBBLICAVA E NON GUARDAVA NESSUNO.
      #
      # Fino a qui il lavoro finiva verde subito dopo `deploy`. Se il sito
      # rispondeva 500 a tutti, il verde restava verde e il primo a saperlo era
      # un cliente. Adesso si va a bussare a tre porte — il processo e' vivo, e'
      # pronto a servire, la home si disegna — e se non rispondono si torna
      # indietro da soli, senza aspettare che qualcuno se ne accorga.
      #
      # La decisione la prende scripts/prova-di-fumo.mjs, che ha le sue prove in
      # tests/unit/la-prova-di-fumo-boccia-un-sito-rotto.test.ts: un collaudo che
      # dice sempre «va bene» sarebbe peggio di nessun collaudo.
      #
      # 31/8/2026 (collaudo del rilascio, difetto ②) — IL NUMERO D'USCITA VA CONSERVATO, NON SOLO SUBITO.
      #
      # «Il sito e' rotto» e «mi e' arrivata una riga a caso al posto
      # dell'indirizzo» non sono la stessa cosa e non possono avere la stessa
      # risposta: sul primo si torna indietro, sul secondo tornare indietro
      # vuol dire buttare via un rilascio magari sanissimo. Il passo dopo
      # legge questo numero per decidere.
      - name: Prova di fumo sul sito appena pubblicato
        id: fumo
        if: steps.rilascio.outputs.indirizzo != ''
        env:
          # L'indirizzo passa da una variabile e non dentro la riga di comando:
          # cosi' resta un dato, e non puo' diventare un pezzo di script.
          INDIRIZZO: ${{ steps.rilascio.outputs.indirizzo }}
        run: |
          set +e
          node scripts/prova-di-fumo.mjs "$INDIRIZZO"
          CODICE=$?
          echo "codice=$CODICE" >> "$GITHUB_OUTPUT"
          exit "$CODICE"

      # 31/8/2026 (collaudo del rilascio, difetto ①) — «ROLLBACK SENZA ARGOMENTI TORNA AL RILASCIO
      # PRECEDENTE»: non e' vero, ed e' costato caro.
      #
      # Nel sorgente della 59.10.0 il primo argomento posizionale vale «status»
      # quando manca. Senza indirizzo il comando finiva nel ramo che si limita a
      # guardare: «No deployment rollback in progress», uscita 0. Il rilascio
      # rotto restava vivo in produzione, il passo diventava verde, e nel
      # riepilogo si leggeva «sono tornata alla versione di prima». Adesso
      # l'indirizzo c'e', e se non c'e' si chiede una mano invece di fingere.
      - name: Torna indietro, il sito appena pubblicato non risponde
        id: ritorno
        # Solo sul numero che vuol dire «il sito e' rotto» (1). Un indirizzo
        # storto (3) non dice niente sul sito: annullare in quel caso sarebbe
        # rompere la produzione per un avviso di aggiornamento della CLI.
        if: always() && steps.fumo.outputs.codice == '1'
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRECEDENTE: ${{ steps.rilascio.outputs.precedente }}
        run: |
          set -euo pipefail
          if [ -z "$PRECEDENTE" ]; then
            echo "::error::Il sito appena pubblicato non risponde e non so a quale rilascio tornare: il ritorno indietro va fatto a mano su Vercel."
            {
              echo "## ⛔ Il sito non risponde e in produzione c'e' ancora lui"
              echo ""
              echo "Non sapevo a quale rilascio tornare, quindi non ho annullato niente."
              echo "Apri Vercel → il progetto → i rilasci, e rimetti in produzione quello di prima."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::error::La prova di fumo e' fallita sul rilascio appena pubblicato: torno a $PRECEDENTE."
          npx --yes vercel@59.10.0 rollback "$PRECEDENTE" --yes --token="$TOKEN"
          # Solo dopo che il comando e' andato a buon fine: `set -e` ferma tutto
          # prima di qui se e' fallito, e una frase scritta comunque sarebbe una
          # bugia lasciata nel riepilogo.
          echo "tornato=si" >> "$GITHUB_OUTPUT"
          {
            echo "## ⛔ Rilascio annullato"
            echo ""
            echo "Il sito appena pubblicato non ha superato la prova di fumo: sono tornata al rilascio $PRECEDENTE."
            echo "Guarda il passo «Prova di fumo» qui sopra per sapere quale dei tre controlli e' caduto."
          } >> "$GITHUB_STEP_SUMMARY"

      # 31/8/2026 (collaudo del rilascio, difetto ③) — VENTIDUE ESECUZIONI SU VENTIDUE VERDI, E NESSUNA
      # AVEVA PROVATO NIENTE.
      #
      # Senza le chiavi di Vercel ogni passo qui sopra ha una condizione che non
      # si avvera, quindi salta: l'ultima esecuzione e' durata cinque secondi
      # con Checkout, Setup Node e tutto il resto «skipped» — e il lavoro e'
      # finito verde. Da fuori quella spunta e' identica a quella di un rilascio
      # controllato, e intanto la produzione usciva da un'altra strada.
      #
      # Questo passo gira SEMPRE, e' l'unico, e dice cosa e' stato verificato
      # davvero. Zero controlli fatti non e' un successo: e' un «non lo so», e
      # un «non lo so» non puo' portare la stessa spunta di un «ho guardato».
      - name: Il verdetto — cosa ho provato davvero
        if: always()
        env:
          PRONTO: ${{ steps.chiavi.outputs.pronto }}
          INDIRIZZO: ${{ steps.rilascio.outputs.indirizzo }}
          CODICE_FUMO: ${{ steps.fumo.outputs.codice }}
          TORNATO: ${{ steps.ritorno.outputs.tornato }}
        run: |
          set -uo pipefail
          VERDETTO="$(mktemp)"
          set +e
          node scripts/prova-di-fumo.mjs --verdetto > "$VERDETTO"
          CODICE=$?
          set -e
          cat "$VERDETTO"
          cat "$VERDETTO" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODICE" != "0" ]; then
            echo "::error::Questo lavoro non ha verificato che il sito risponda: leggi il riepilogo qui sopra prima di fidarti della produzione."
            exit 1
          fi
