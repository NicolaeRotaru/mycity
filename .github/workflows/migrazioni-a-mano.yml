name: Migrazioni a mano (produzione)

# 19/10/2026 — IL RIALLINEAMENTO DEL DATABASE, DA UN PULSANTE.
#
# In produzione mancano 48 migrazioni (docs/migrazioni-baseline-produzione.md,
# passo 2). Il rilascio automatico non le applica da solo, apposta: sopra le 20
# si ferma (MASSIMO_MIGRAZIONI in deploy-dopo-ci.yml). La procedura dice di
# farlo a mano, una volta, con la firma di Nicola.
#
# «A mano» non ha funzionato da nessuna delle strade provate il 19/10:
#   · dallo strumento Supabase della sessione è entrata solo la 091. Ogni comando
#     che cancella o sostituisce qualcosa chiede una conferma, e quella conferma
#     sul telefono di Nicola non compare: la chiamata scade dopo un minuto;
#   · dal computer di Nicola servono psql, la versione 17 e la password a mano.
#
# Qui gira lo stesso script del rilascio, sui file del repository così come
# sono, con la riga del Session pooler che sta già nei segreti. È lo script
# provato l'11/10 su una copia fedele della produzione: «applicate 48», uscita
# 0, zero differenze con un database costruito dal repository.
#
# Parte solo da chi lo avvia a mano dalla pagina Actions, solo da `main`, e solo
# se nella casella scrive APPLICA: un clic distratto su «Run workflow» non
# tocca il database.

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: "Scrivi APPLICA per applicare al database di produzione le migrazioni che mancano"
        required: true
        type: string

# Lo stesso gruppo per due avvii ravvicinati: il secondo aspetta il primo.
# Due copie dello script in parallelo applicherebbero due volte lo stesso file.
concurrency:
  group: migrazioni-produzione
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  applica:
    name: Applica le migrazioni che mancano
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo dal ramo principale: da un altro ramo arriverebbero file non uniti.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: La conferma scritta
        env:
          CONFERMA: ${{ inputs.conferma }}
        run: |
          if [ "$CONFERMA" != "APPLICA" ]; then
            echo "::error::Nella casella c'e' scritto altro da APPLICA: non tocco il database."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Si guarda solo la FORMA della riga, mai il valore: il segreto non
      # finisce nel registro del lavoro.
      - name: La riga del database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Manca il segreto SUPABASE_DB_URL: non tocco il database. Va in Settings → Secrets and variables → Actions, con la riga del «Session pooler» di Supabase."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL deve cominciare con postgresql:// (oppure postgres://): va incollata la riga intera del «Session pooler», senza «psql» davanti, senza virgolette e senza spazi."
              exit 1
              ;;
          esac
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL punta alla connessione diretta (db.<progetto>.supabase.co), che risponde solo in IPv6: da GitHub non si raggiunge. Serve la riga del «Session pooler»: Supabase → Connect → Session pooler."
              exit 1
              ;;
          esac

      # Il client della stessa versione del database, come nella copia notturna
      # (backup-db.yml spiega perché il PATH va sistemato a mano).
      - name: Installa il client Postgres
        env:
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          echo "/usr/lib/postgresql/${VERSIONE_ATTESA}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${VERSIONE_ATTESA}/bin:$PATH"
          psql --version
          psql --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::psql non e' la versione ${VERSIONE_ATTESA}."
            exit 1
          }

      - name: Applica le migrazioni che mancano
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Il tetto del rilascio automatico e' 20. Qui il riallineamento e'
          # voluto e firmato: 60 lascia passare le 48 e ferma ancora un
          # database rimasto indietro di un'era intera.
          MASSIMO_MIGRAZIONI: "60"
        run: |
          set -euo pipefail
          DIARIO="$(mktemp)"
          bash scripts/applica-migrazioni-mancanti.sh | tee "$DIARIO"
          {
            echo "## Migrazioni applicate in produzione"
            echo ""
            grep '^▶ applico ' "$DIARIO" | sed 's/^▶ applico /- /' || echo "- nessuna: mancava niente"
          } >> "$GITHUB_STEP_SUMMARY"

      # La prova che lo script e' arrivato in fondo: rilanciato, non deve
      # trovare piu' niente da applicare.
      - name: Seconda passata, deve applicarne zero
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MASSIMO_MIGRAZIONI: "60"
        run: |
          set -euo pipefail
          DIARIO="$(mktemp)"
          bash scripts/applica-migrazioni-mancanti.sh | tee "$DIARIO"
          if grep -q '^▶ applico ' "$DIARIO"; then
            echo "::error::La seconda passata ha applicato ancora qualcosa: il registro delle migrazioni non torna."
            exit 1
          fi

      # I cinque punti del passo 3 della procedura, letti dal database vero.
      - name: I cinque controlli del passo 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          ESITO="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select concat_ws('|',
              (select prosrc like '%''pending''%' from pg_proc
                where oid = 'public.handle_new_user()'::regprocedure),
              pg_get_constraintdef((select oid from pg_constraint
                where conname = 'orders_rider_payout_status_check')) like '%HELD%',
              not exists (select 1 from pg_policies where schemaname = 'public'
                and policyname in ('Anyone can read active coupons','Public profile read',
                                   'Anyone can view approved seller profiles',
                                   'Riders can view buyer of assigned orders',
                                   'sponsored_listings_owner_rw','messages_update_read')),
              exists(select 1 from information_schema.columns
                where table_name = 'order_items' and column_name = 'product_name'),
              exists(select 1 from pg_proc where proname = 'enqueue_order_status_email'))")"
          echo "iscrizione in attesa | compenso HELD | porte chiuse | nome prodotto | email ordine"
          echo "$ESITO"
          echo "**Controlli del passo 3:** \`$ESITO\` (atteso \`t|t|t|t|t\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ESITO" != "t|t|t|t|t" ]; then
            echo "::error::Non tutti e cinque i controlli del passo 3 sono veri."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Il database e' allineato al codice
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SALTO_E_ERRORE: "1"
        run: npm ci --legacy-peer-deps && npm run db:check-drift
