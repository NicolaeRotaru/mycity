name: Migrazioni a mano (produzione)

# 19/10/2026 — IL RIALLINEAMENTO DEL DATABASE, DA UN PULSANTE.
#
# In produzione mancano 48 migrazioni (docs/migrazioni-baseline-produzione.md,
# passo 2). Il rilascio automatico non le applica da solo, apposta: sopra le 20
# si ferma (MASSIMO_MIGRAZIONI in deploy-dopo-ci.yml). La procedura dice di
# farlo a mano, una volta, con la firma di Nicola.
#
# «A mano» non ha funzionato da nessuna delle strade provate il 19/10:
#   · dallo strumento Supabase della sessione è entrata solo la 091. Ogni comando
#     che cancella o sostituisce qualcosa chiede una conferma, e quella conferma
#     sul telefono di Nicola non compare: la chiamata scade dopo un minuto;
#   · dal computer di Nicola servono psql, la versione 17 e la password a mano.
#
# Qui gira lo stesso script del rilascio, sui file del repository così come
# sono, con la riga del Session pooler che sta nei segreti. È lo script provato
# l'11/10 su una copia fedele della produzione: «applicate 48», uscita 0, zero
# differenze con un database costruito dal repository.
#
# Parte solo da chi lo avvia a mano dalla pagina Actions, solo da `main`, solo
# se nella casella scrive APPLICA e solo se il numero di migrazioni che si
# aspetta coincide con quelle che mancano davvero. Il conto si fa prima di
# scrivere: se non torna, il database resta com'è.

on:
  workflow_dispatch:
    inputs:
      conferma:
        description: "Scrivi APPLICA per applicare al database di produzione le migrazioni che mancano"
        required: true
        type: string
      quante:
        description: "Quante migrazioni ti aspetti che manchino (il 19/10 erano 48). Se il conto è diverso, il lavoro si ferma prima di scrivere"
        required: true
        type: string

# Lo stesso gruppo del rilascio automatico (deploy-dopo-ci.yml): i due lavori
# applicano gli stessi file con lo stesso script, quindi si aspettano a vicenda.
# Con due gruppi diversi, un'unione su main durante questo lavoro farebbe
# partire il rilascio sulle stesse migrazioni, e alcune entrerebbero due volte.
# Effetto collaterale voluto: un rilascio in attesa viene sostituito da questo
# lavoro (GitHub tiene un solo lavoro in attesa per gruppo) e ripartirà alla
# prossima unione.
concurrency:
  group: rilascio-produzione
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  applica:
    name: Applica le migrazioni che mancano
    # La versione fissa: con `ubuntu-latest` il computer di turno può cambiare
    # sotto i piedi, e il deposito dei pacchetti di PostgreSQL deve conoscerla.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Solo dal ramo principale: da un altro ramo arriverebbero file non uniti.
    if: github.ref == 'refs/heads/main'
    # L'ambiente esiste per dare a Nicola un freno in più: in Settings →
    # Environments → database-produzione può chiedere che ogni avvio aspetti il
    # suo «Approve». Senza quella spunta il lavoro parte come prima.
    environment: database-produzione
    steps:
      - name: La conferma scritta
        env:
          CONFERMA: ${{ inputs.conferma }}
          QUANTE: ${{ inputs.quante }}
        run: |
          if [ "$CONFERMA" != "APPLICA" ]; then
            echo "::error::Nella casella della conferma c'e' scritto altro da APPLICA: non tocco il database."
            exit 1
          fi
          case "$QUANTE" in
            ''|*[!0-9]*)
              echo "::error::Nella casella «quante» va un numero intero (il 19/10: 48). Non tocco il database."
              exit 1
              ;;
          esac

      # La copia notturna parte alle 02:17 UTC (backup-db.yml) e il primo del
      # mese alle 03:41 c'e' la prova di ripristino. Se le migrazioni partissero
      # insieme, le modifiche allo schema resterebbero in coda dietro la copia e
      # bloccherebbero anche le letture del sito.
      - name: Non durante la copia notturna
        run: |
          ORA="$(date -u +%H)"
          if [ "$ORA" = "02" ] || [ "$ORA" = "03" ]; then
            echo "::error::Fra le 02:00 e le 04:00 UTC gira la copia notturna del database: riavvia dopo le 04:00 UTC."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # Si guarda solo la FORMA della riga, mai il valore: il segreto non
      # finisce nel registro del lavoro.
      - name: La riga del database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Manca il segreto SUPABASE_DB_URL: non tocco il database. Va in Settings → Secrets and variables → Actions, con la riga del «Session pooler» di Supabase."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            postgresql://*|postgres://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL deve cominciare con postgresql:// (oppure postgres://): va incollata la riga intera del «Session pooler», senza «psql» davanti, senza virgolette e senza spazi."
              exit 1
              ;;
          esac
          case "$SUPABASE_DB_URL" in
            *@db.*.supabase.co*)
              echo "::error::SUPABASE_DB_URL punta alla connessione diretta (db.<progetto>.supabase.co), che risponde solo in IPv6: da GitHub non si raggiunge. Serve la riga del «Session pooler»: Supabase → Connect → Session pooler, porta 5432."
              exit 1
              ;;
            *pooler.supabase.com:6543*)
              echo "::error::SUPABASE_DB_URL punta al Transaction pooler (porta 6543), che non tiene la sessione di una migrazione. Serve la riga del «Session pooler»: Supabase → Connect → Session pooler, porta 5432."
              exit 1
              ;;
          esac

      # Il client della stessa versione del database, come nella copia notturna
      # (backup-db.yml spiega perché il PATH va sistemato a mano).
      - name: Installa il client Postgres
        env:
          VERSIONE_ATTESA: "17"
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "postgresql-client-${VERSIONE_ATTESA}"
          echo "/usr/lib/postgresql/${VERSIONE_ATTESA}/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/${VERSIONE_ATTESA}/bin:$PATH"
          psql --version
          psql --version | grep -q " ${VERSIONE_ATTESA}\." || {
            echo "::error::psql non e' la versione ${VERSIONE_ATTESA}."
            exit 1
          }

      # Il conto, senza scrivere: con tetto 0 lo script si ferma prima di
      # toccare il database (uscita 4) ed elenca quelle che mancano.
      - name: Conta quelle che mancano, senza toccare niente
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          QUANTE: ${{ inputs.quante }}
        run: |
          set -uo pipefail
          ELENCO="$(mktemp)"
          USCITA=0
          MASSIMO_MIGRAZIONI=0 bash scripts/applica-migrazioni-mancanti.sh > /dev/null 2> "$ELENCO" || USCITA=$?
          if [ "$USCITA" != "0" ] && [ "$USCITA" != "4" ]; then
            cat "$ELENCO" >&2
            echo "::error::Lo script si e' fermato prima del conto (uscita $USCITA): non ho applicato niente."
            exit 1
          fi
          N="$(grep -cE '^    - .+\.sql$' "$ELENCO" || true)"
          {
            echo "## Migrazioni che mancano: $N (attese: $QUANTE)"
            echo ""
            grep -E '^    - .+\.sql$' "$ELENCO" | sed 's/^    //' || true
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^    - .+\.sql$' "$ELENCO" || true
          if [ "$N" != "$QUANTE" ]; then
            echo "::error::Ne mancano $N, ma ne aspettavi $QUANTE: non tocco il database. L'elenco e' qui sopra."
            exit 1
          fi

      - name: Applica le migrazioni che mancano
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Il tetto e' il numero contato e confermato qui sopra, non uno di piu'.
          MASSIMO_MIGRAZIONI: ${{ inputs.quante }}
        run: |
          set -uo pipefail
          DIARIO="$(mktemp)"
          USCITA=0
          bash scripts/applica-migrazioni-mancanti.sh | tee "$DIARIO" || USCITA=$?
          # Il riepilogo si scrive anche se lo script si e' fermato a meta': chi
          # guarda deve sapere quali sono entrate prima del guasto.
          {
            echo "## Migrazioni applicate in produzione"
            echo ""
            grep '^▶ applico ' "$DIARIO" | sed 's/^▶ applico /- /' || echo "- nessuna"
            if [ "$USCITA" != "0" ]; then
              echo ""
              echo "**Lo script si e' fermato (uscita $USCITA).** L'ultima della lista e' quella che non e' entrata: il suo file gira in una transazione, quindi non ha lasciato mezzo lavoro. Le altre sono entrate. Il motivo e' nel registro di questo passo."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$USCITA"

      # La prova che lo script e' arrivato in fondo: col tetto 0, se mancasse
      # ancora qualcosa si fermerebbe senza applicarlo (uscita 4).
      - name: Seconda passata, non deve mancare niente
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          MASSIMO_MIGRAZIONI: "0"
        run: |
          set -uo pipefail
          DIARIO="$(mktemp)"
          USCITA=0
          bash scripts/applica-migrazioni-mancanti.sh 2>&1 | tee "$DIARIO" || USCITA=$?
          if [ "$USCITA" != "0" ] || grep -q '^▶ applico ' "$DIARIO"; then
            echo "::error::Dopo l'applicazione manca ancora qualcosa (uscita $USCITA): il registro delle migrazioni non torna."
            exit 1
          fi

      # I cinque punti del passo 3 della procedura, letti dal database vero.
      - name: I cinque controlli del passo 3
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          ESITO="$(psql "$SUPABASE_DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c "
            select concat_ws('|',
              (select prosrc like '%''pending''%' from pg_proc
                where oid = 'public.handle_new_user()'::regprocedure),
              pg_get_constraintdef((select oid from pg_constraint
                where conname = 'orders_rider_payout_status_check')) like '%HELD%',
              not exists (select 1 from pg_policies where schemaname = 'public'
                and policyname in ('Anyone can read active coupons','Public profile read',
                                   'Anyone can view approved seller profiles',
                                   'Riders can view buyer of assigned orders',
                                   'sponsored_listings_owner_rw','messages_update_read')),
              exists(select 1 from information_schema.columns
                where table_name = 'order_items' and column_name = 'product_name'),
              exists(select 1 from pg_proc where proname = 'enqueue_order_status_email'))")"
          echo "iscrizione in attesa | compenso HELD | porte chiuse | nome prodotto | email ordine"
          echo "$ESITO"
          echo "**Controlli del passo 3:** \`$ESITO\` (atteso \`t|t|t|t|t\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ESITO" != "t|t|t|t|t" ]; then
            echo "::error::Non tutti e cinque i controlli del passo 3 sono veri."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # Senza il segreto nell'ambiente: gli script d'installazione dei pacchetti
      # (nove ne hanno uno) non devono poter leggere la riga del database.
      - name: Installa le dipendenze
        run: npm ci --legacy-peer-deps

      - name: Il database e' allineato al codice
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SALTO_E_ERRORE: "1"
        run: npm run db:check-drift
