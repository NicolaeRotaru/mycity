name: Deriva migrazioni (produzione)

# #233 — Il controllo che deve accorgersi delle migrazioni dimenticate non
# poteva diventare rosso.
#
# Dentro la CI, `db:check-drift` gira contro il database che la CI stessa ha
# appena ricostruito applicando tutte le migrazioni del repository: confronta
# il repo con una copia del repo, quindi è verde per costruzione. Un verde che
# non prova niente è peggio di nessun controllo, perché rassicura.
#
# Il confronto che conta è con il database VERO: quali migrazioni sono scritte
# nel repository e non sono mai state applicate in produzione. È esattamente lo
# scenario che il 19 agosto ha fermato a metà la migrazione 119 (la tabella
# catalog_ai_jobs non esisteva perché la 099 non era mai stata applicata).
#
# Gira ogni notte e a comando, NON sulle richieste di unione: se il segreto
# manca il lavoro fallisce con un messaggio chiaro — ma non blocca il lavoro di
# nessuno, perché non è un controllo obbligatorio sulle PR.
#
# Serve il segreto SUPABASE_DB_URL (la stessa stringa usata dal backup: la riga
# del «Session pooler», IPv4). La lettura è sola lettura: una SELECT su una
# tabella di sistema.

on:
  schedule:
    - cron: "42 6 * * *" # ogni mattina alle 06:42 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deriva:
    name: Migrazioni nel repo ma non in produzione
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 27/8/2026 (R191) — Qui c'era "20" mentre tutto il resto — la CI, il
          # rilascio, il campo `engines` di package.json — dice 24. Il controllo
          # notturno che deve accorgersi delle migrazioni dimenticate girava
          # quindi su un motore diverso dalla produzione: quello che vede lui
          # non e' quello che succede in produzione, ed e' il tipo di differenza
          # che si scopre tardi e male.
          node-version: "24"
          cache: "npm"

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Verifica di avere la stringa di connessione
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB" ]; then
            # 15/10/2026 (R53) — Il messaggio mandava a prendere la «Connection
            # string» generica, cioe' la connessione diretta: solo IPv6, che da qui
            # non si raggiunge. Con quella il lavoro e' finito rosso 52 mattine su
            # 52 senza confrontare niente. Serve la riga del Session pooler.
            echo "::error::SUPABASE_DB_URL non configurato: il controllo della deriva NON può girare. Aggiungilo in GitHub → Settings → Secrets and variables → Actions, con la riga del «Session pooler» (IPv4): Supabase → pannello Connect → riquadro «Session pooler», porta 5432. NON la connessione diretta db.<progetto>.supabase.co, che risponde solo in IPv6 e da GitHub Actions non si raggiunge."
            exit 1
          fi

      - name: Confronta il repository con il database vero
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # 5/11/2026 — «Saltato» non e' «passato»: senza `pg` lo script usciva 0 e il lavoro era
          # verde senza aver confrontato niente.
          SALTO_E_ERRORE: "1"
        # 1/11/2026 (ondata 9) — Il colore rosso da solo non diceva QUALE dei
        # due guasti: «non mi collego» e «mancano migrazioni» uscivano tutti e
        # due con 1. Adesso lo script li separa (1 = non ho controllato,
        # 2 = deriva vera) e qui si traduce il numero in una riga che si legge
        # in cima al lavoro. Le prove: tests/unit/la-deriva-distingue-non-mi-collego-da-mancano-migrazioni.test.ts
        run: |
          set +e
          npm run db:check-drift
          codice=$?
          set -e
          if [ "$codice" -eq 2 ]; then
            echo "::error::Mancano migrazioni in produzione: sono scritte nel repository ma il database vero non le ha mai applicate. L'elenco e' nel log qui sopra."
          elif [ "$codice" -ne 0 ]; then
            echo "::error::Il confronto NON e' partito: non mi sono collegata al database (il perche' e' nel log qui sopra). Non vuol dire che mancano migrazioni. Da GitHub Actions in SUPABASE_DB_URL serve la riga del «Session pooler» (IPv4, porta 5432), non la connessione diretta db.<progetto>.supabase.co."
          fi
          exit "$codice"
